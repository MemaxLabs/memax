# Memax Worker — PRODUCTION
# Deploy: fly deploy -c fly/fly.worker.production.toml (from packages/server/)
#
# Staging has no worker app: its API runs the worker in-process
# (MEMAX_EMBEDDED_WORKER in fly/fly.server.staging.toml), so idle
# staging costs nothing. Workers process the River queue (memory
# processing, embeddings, dreams engine, email sends).
app = "memax-worker-production"
primary_region = "sjc"
swap_size_mb = 512

[build]
  # Dockerfile path is relative to THIS toml file (not cwd), so
  # ../ navigates up from fly/ to the server package root.
  dockerfile = "../Dockerfile.worker"

[env]
  # V2 compile service: a Cloudflare Worker (packages/compile-service/
  # wrangler.jsonc, deployed before this app by CI). It needs
  # COMPILE_SERVICE_TOKEN, a secret synced from Doppler with the rest.
  COMPILE_SERVICE_URL = "https://compile.memax.app"
  HEALTH_PORT = "9090"

[deploy]
  # Migrations run via the API server's release_command on the shared
  # database. Worker skips them to avoid concurrent DDL contention —
  # if two processes try to acquire the migrate lock simultaneously
  # one will fail, and that's the one we don't want to be the server.
  strategy = "rolling"

# Internal health endpoint for Fly's machine supervisor. Not exposed
# to the public internet — the worker's real job is River queue
# processing, HTTP is check-only.
[http_service]
  internal_port = 9090
  force_https = true
  # Workers never auto-stop. Queue backlogs would accumulate silently
  # while every machine was stopped, then wake up to a thundering
  # herd. Keep them running.
  auto_stop_machines = false
  auto_start_machines = true
  # 1 = baseline. River queue persists jobs in Postgres, so a single
  # worker going down briefly just delays processing — no data loss.
  # Scale to 2+ with `fly scale count -a memax-worker-production N`
  # once queue depth starts trending up or we need faster recovery.
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  # Workers do the heavy lifting — embedding batches, LLM processing,
  # attachment processing (PDFs, images). Almost all of it waits on
  # Voyage, the LLM or Postgres rather than the CPU, so one shared CPU
  # with 1gb is enough at today's volume (Oct 2026 running-cost review:
  # $6.96/month in sjc, against $13.92 for shared-cpu-2x). Jobs are
  # queued, so a slower PDF extraction delays nobody's request. Move
  # back to shared-cpu-2x if River's job durations or queue lag grow.
  size = "shared-cpu-1x"
  memory = "1gb"

[swap]
  size_mb = 1024
