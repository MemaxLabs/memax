# SPDX-License-Identifier: Apache-2.0
#
# The /v2 contract. This file is the source of truth: the Go handlers are
# tested against it (internal/contract), and the SDK's v2 types are generated
# from it (packages/sdk, `pnpm --filter memax-sdk gen:v2`). It is licensed
# Apache-2.0, unlike the rest of packages/server, so the Apache-2.0 SDK and
# CLI can carry types generated from it.
#
# Conventions the contract tests enforce (internal/contract/lint.go):
#   - every object schema with properties sets additionalProperties: false;
#   - every response body is a named schema: an envelope with `data`, or
#     ErrorEnvelope for 4xx and 5xx;
#   - every POST and PATCH requires Idempotency-Key;
#   - every operation documents 401, 429, 500 and 503.
openapi: 3.1.1
info:
  title: Memax API v2
  version: 2.0.0-alpha.1
  summary: The record your agents read from, with a receipt for every change.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    The `/v2` API reads and changes the V2 record: memories, their versions,
    sources and receipts, in the spaces you belong to.

    ## Envelope

    Every response is JSON. A success carries `{"data": …}`. An error carries
    `{"error": {"code", "message", "details"}}`. `code` is stable and
    machine-readable; `message` is an English sentence that says what to do.

    ## Commands

    A command is a `POST` (or the `PATCH` that sets an agent's autonomy)
    that changes the record: remember, keep, edit and reject a memory;
    pause, resume, disconnect and set the autonomy of an agent. Every
    command:

    - needs an `Idempotency-Key` header (1 to 255 characters). Retrying a
      command with the same key returns the original result and writes
      nothing; the response then carries `Idempotent-Replayed: true`. A key
      reused for a different command or different content is refused with
      422 `idempotency_key_reused`.
    - writes one or more receipts in the same transaction. A receipt never
      holds the memory's words.
    - is decided by policy, not by the client. A person who is a member or
      owner keeps what they remember; a viewer's words, an agent's and an API
      key's go to Review as proposals. `policy` in the result says why.
      Agents propose and people keep: an API key can never keep or reject.

    A refusal is 403 `refused` with `details.policy`; clients localise by
    `details.policy.code` and fall back to `details.policy.message`.

    ## Versions and If-Match

    A memory's `version` is the version of its statement. Reads return it in
    the body and in the `ETag` header (`"3"`). Edits require
    `If-Match: "<version>"`; a stale version is 412 `edit_clash`. Keep and
    reject accept `If-Match` too, so a person never keeps words they haven't
    seen.

    ## Who made a change, and how sure Memax is

    A session token acts as the person; an API key or OAuth grant acts as
    the agent connection it is bound to. A person's keep records an
    assurance: `human_web` when Memax can tell the person was on the web
    app, `client_attested` otherwise (the CLI, an agent, any other client).
    Memax tells by two things together: the session was issued to the web
    app, and the web app's server-side proxy signed the request
    (`X-Memax-Surface-*` headers). Other clients must not send those
    headers; a request that carries them and doesn't verify is refused
    with 403 `surface_unverified`. Quarantined proposals, decisions in
    spaces where they need a person on the web (team spaces by default),
    and raising what an agent may do all need `human_web`.

    ## Display IDs

    `M-0219` is unique within a tenant, not across tenants, so a display ID
    always travels with its space: `GET /v2/memories/M-0219?space=memax-v2`.
    A memory's uuid (`id`) needs no space.

    ## Not found, never forbidden

    A space or memory outside your spaces is 404, the same as one that doesn't
    exist, so the API never confirms that something exists.

    ## Pagination

    Lists return `{"items", "has_more", "next_cursor"}`, newest first unless
    the operation says otherwise. Pass `next_cursor` back as `cursor`.
    Cursors are opaque and belong to the list that issued them.

    ## Errors

    | Status | Code | When |
    | --- | --- | --- |
    | 400 | `invalid_request` | The request is malformed; `details.field` names the field. |
    | 400 | `idempotency_key_required` | A command came without `Idempotency-Key`. |
    | 400 | `space_required` | A display ID came without `?space=`. |
    | 400 | `ambiguous_ref` | A display ID matches memories in more than one space. |
    | 401 | `unauthorized` | No valid credential. |
    | 403 | `refused` | Policy refused the command; see `details.policy`. |
    | 403 | `permission_denied` | The credential can't read memories at all. |
    | 403 | `impersonation_read_only` | An impersonated session tried a command. |
    | 403 | `surface_unverified` | A request claimed to come from the web app, and its signature didn't verify. |
    | 404 | `not_found` | No such space or memory in your spaces. |
    | 405 | `method_not_allowed` | The path exists, the method doesn't. |
    | 409 | `invalid_transition` | The memory's state doesn't allow the command. |
    | 412 | `edit_clash` | `If-Match` is not the memory's current version. |
    | 422 | `idempotency_key_reused` | The key was used for a different command. |
    | 428 | `precondition_required` | An edit came without `If-Match`. |
    | 429 | `rate_limited` | Too many requests; see `Retry-After`. |
    | 500 | `internal_error` | Something failed on our side. |
    | 503 | `busy` | Another change holds the memory; see `Retry-After`. |
    | 503 | `unavailable` | The record is not configured on this server. |
servers:
  - url: https://api.memax.app
security:
  - bearer: []
tags:
  - name: spaces
    description: The spaces you belong to.
  - name: memories
    description: One statement each, under a seal.
  - name: review
    description: What needs a person.
  - name: activity
    description: The receipts of every change.
  - name: agents
    description: The agents connected to your spaces, and what each may do in each.
paths:
  /v2/spaces:
    get:
      operationId: listSpaces
      tags: [spaces]
      summary: List your spaces
      description: Every space you belong to, with your role in it. Not paginated.
      responses:
        '200':
          description: Your spaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/spaces/{space}/memories:
    parameters:
      - $ref: '#/components/parameters/SpacePath'
    post:
      operationId: rememberMemory
      tags: [memories]
      summary: Remember a statement
      description: |
        Writes one statement to the space. Policy decides what happens: a
        member or owner keeps it (`outcome: applied`); a viewer, an agent or
        an API key proposes it (`outcome: proposed`), and it waits in Review.
        An agent's statement that cites an external source is always
        proposed and quarantined (`policy.quarantine`). A statement that
        contains a credential is refused.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RememberRequest'
      responses:
        '201':
          description: The memory was written, kept or proposed.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      operationId: listMemories
      tags: [memories]
      summary: List memories
      description: |
        The space's memories, newest first. Without `state`, every state
        except `rejected` is listed. Sources are not included; read one
        memory for its sources.
      parameters:
        - name: state
          in: query
          description: Only these displayed states. Repeat for more than one.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/State'
        - name: section
          in: query
          description: Only these sections. Repeat for more than one.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Section'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of memories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryPageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/spaces/{space}/review:
    parameters:
      - $ref: '#/components/parameters/SpacePath'
    get:
      operationId: listReview
      tags: [review]
      summary: List what needs a person
      description: |
        Review's queue: every proposal, then kept memories flagged as a
        conflict, then kept memories flagged as stale. Within each group the
        oldest comes first, so the queue drains in the order things arrived.
        `total` counts the whole queue, not just this page.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/spaces/{space}/receipts:
    parameters:
      - $ref: '#/components/parameters/SpacePath'
    get:
      operationId: listReceipts
      tags: [activity]
      summary: List receipts
      description: |
        The space's Activity: every receipt, newest first. Receipts name the
        actor, the action and the object; they never hold the memory's words.
        Pass `memory` for one memory's history.
      parameters:
        - name: memory
          in: query
          description: Only this memory's receipts, by display ID (M-0219) or id.
          schema:
            $ref: '#/components/schemas/MemoryRef'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of receipts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptPageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/memories/{ref}:
    parameters:
      - $ref: '#/components/parameters/RefPath'
      - $ref: '#/components/parameters/SpaceContext'
    get:
      operationId: getMemory
      tags: [memories]
      summary: Read one memory
      description: |
        One memory with its sources, every version of its statement (newest
        first) and its latest receipts. `receipts.next_cursor` continues on
        `GET /v2/spaces/{space}/receipts?memory={id}`.
      responses:
        '200':
          description: The memory and its history.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryDetailEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/memories/{ref}:keep:
    parameters:
      - $ref: '#/components/parameters/RefPath'
      - $ref: '#/components/parameters/SpaceContext'
    post:
      operationId: keepMemory
      tags: [review]
      summary: Keep a proposal
      description: |
        Keeps a proposal. Only a person who is a member or owner can keep
        (per the space's rules); agents and API keys are refused. Send
        `If-Match` with the version you reviewed.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchOptional'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '412':
          $ref: '#/components/responses/EditClash'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/memories/{ref}:edit:
    parameters:
      - $ref: '#/components/parameters/RefPath'
      - $ref: '#/components/parameters/SpaceContext'
    post:
      operationId: editMemory
      tags: [memories]
      summary: Edit a memory
      description: |
        Writes a new version of the statement, and optionally moves it to
        another section. `If-Match` is required. When policy sends the edit
        to Review (an agent editing what a person kept, for example), the
        result is a new proposal that supersedes the memory, and the memory
        itself is unchanged. `keep: true` keeps a proposal after editing it.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '412':
          $ref: '#/components/responses/EditClash'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/memories/{ref}:reject:
    parameters:
      - $ref: '#/components/parameters/RefPath'
      - $ref: '#/components/parameters/SpaceContext'
    post:
      operationId: rejectMemory
      tags: [review]
      summary: Reject a proposal
      description: |
        Rejects a proposal. Only a person who is a member or owner can
        reject. `reason` goes into the receipt.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchOptional'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '412':
          $ref: '#/components/responses/EditClash'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List your agents
      description: |
        Your agent connections, oldest first: each one's autonomy in every
        space of yours it is connected to, when it was last seen, and its
        writes in the last 7 days. Disconnected agents are left out. With an
        agent's own credential, only that agent is listed. Not paginated.
      responses:
        '200':
          description: Your agents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/spaces/{space}/agents:
    parameters:
      - $ref: '#/components/parameters/SpacePath'
    get:
      operationId: listSpaceAgents
      tags: [agents]
      summary: List the agents in a space
      description: |
        Every agent connected to the space, whoever it works for, oldest
        first, with its autonomy there and its writes there in the last 7
        days. Of other people's agents you see only the spaces you share.
        Disconnected agents are left out. Not paginated.
      responses:
        '200':
          description: The space's agents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/agents/{agent}:
    parameters:
      - $ref: '#/components/parameters/AgentPath'
    get:
      operationId: getAgent
      tags: [agents]
      summary: Read one agent
      description: |
        One agent connection with what it did this week, its latest writes
        (receipts, which never hold the words) and its latest sessions, in
        your spaces. Disconnected agents can still be read.
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetailEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/agents/{agent}/spaces/{space}:
    parameters:
      - $ref: '#/components/parameters/AgentPath'
      - $ref: '#/components/parameters/SpacePath'
    patch:
      operationId: setAgentAutonomy
      tags: [agents]
      summary: Set what an agent may do in a space
      description: |
        Sets the agent's autonomy in the space, connecting it there if it
        isn't yet. Only a person changes what an agent may do, never an
        agent. Lowering is always allowed for your own agent, and a space's
        owners may lower anyone's agent there. Raising needs you on the web
        (assurance `human_web`), so an agent driving the CLI with your login
        can't raise itself; connecting at no more than the space's default
        (Propose unless its rules say otherwise) is the exception. Write
        needs you to be able to keep in the space, and an API key's agent
        proposes at most. The same level again writes nothing.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutonomyRequest'
      responses:
        '200':
          $ref: '#/components/responses/AgentCommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/agents/{agent}:pause:
    parameters:
      - $ref: '#/components/parameters/AgentPath'
    post:
      operationId: pauseAgent
      tags: [agents]
      summary: Pause an agent
      description: |
        Stops the agent writing anywhere until it is resumed; it can still
        read. Only the person it works for can pause it. The receipt goes to
        every space it is connected to.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCommandRequest'
      responses:
        '200':
          $ref: '#/components/responses/AgentCommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/agents/{agent}:resume:
    parameters:
      - $ref: '#/components/parameters/AgentPath'
    post:
      operationId: resumeAgent
      tags: [agents]
      summary: Resume a paused agent
      description: |
        Lets a paused agent write again, at the autonomy it had. Resuming is
        raising, so it needs you on the web (assurance `human_web`): an agent
        can't resume itself.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCommandRequest'
      responses:
        '200':
          $ref: '#/components/responses/AgentCommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/agents/{agent}:disconnect:
    parameters:
      - $ref: '#/components/parameters/AgentPath'
    post:
      operationId: disconnectAgent
      tags: [agents]
      summary: Disconnect an agent
      description: |
        Ends the connection for good and revokes its credential (the API key
        or OAuth grant) in the same transaction, so the agent stops working
        at once. Only the person it works for can disconnect it. To use the
        agent again, connect it again.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCommandRequest'
      responses:
        '200':
          $ref: '#/components/responses/AgentCommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        A signed-in session token, an OAuth access token, or an API key
        (`mxk_…`). A session acts as the person. An API key or an OAuth
        grant acts as the agent connection it is bound to, at that
        connection's autonomy in each space (Read when the credential has no
        write access; an API key proposes at most). A credential with no
        connection, or a paused one, only reads.

  parameters:
    SpacePath:
      name: space
      in: path
      required: true
      description: The space's id or slug.
      schema:
        $ref: '#/components/schemas/SpaceKey'
    SpaceContext:
      name: space
      in: query
      description: |
        The space a display ID belongs to, by id or slug. Required with a
        display ID; optional with a memory id, where it must match.
      schema:
        $ref: '#/components/schemas/SpaceKey'
    RefPath:
      name: ref
      in: path
      required: true
      description: A display ID (M-0219, with `?space=`) or a memory id.
      schema:
        $ref: '#/components/schemas/MemoryRef'
    AgentPath:
      name: agent
      in: path
      required: true
      description: The agent connection's id.
      schema:
        $ref: '#/components/schemas/Id'
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Limit:
      name: limit
      in: query
      description: Page size. Larger values are capped at 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A key you choose for this command, such as a uuid. Send the same key
        when you retry; send a new key for a new command.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `ETag` (memory version) you started from, e.g. `"3"`.
      schema:
        $ref: '#/components/schemas/VersionTag'
    IfMatchOptional:
      name: If-Match
      in: header
      description: The `ETag` (memory version) you reviewed, e.g. `"3"`.
      schema:
        $ref: '#/components/schemas/VersionTag'
    Via:
      name: X-Memax-Via
      in: header
      description: |
        The surface the command came through, for its receipt. Defaults to
        `api`. Every value here records a client-attested change; Memax
        records a change as made by a person on the web (`via: web`) only
        when the web app's proxy signed the request for a session issued to
        the web app.
      schema:
        type: string
        enum: [api, cli, mcp]

  headers:
    ETag:
      description: The memory's version, quoted. Send it back as `If-Match`.
      required: true
      schema:
        $ref: '#/components/schemas/VersionTag'
    Location:
      description: The memory's URL, by id.
      required: true
      schema:
        type: string
        format: uri-reference
    IdempotentReplayed:
      description: Set to `true` when the Idempotency-Key was already applied and nothing new was written.
      schema:
        type: string
        enum: ['true']
    RetryAfter:
      description: Seconds to wait before retrying.
      required: true
      schema:
        type: string
        pattern: '^[0-9]+$'

  responses:
    CommandResult:
      description: The command was applied, or sent to Review.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandResultEnvelope'
    AgentCommandResult:
      description: The change to the agent was applied (or there was nothing to change).
      headers:
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentCommandResultEnvelope'
    BadRequest:
      description: |
        `invalid_request`, `idempotency_key_required`, `space_required` or
        `ambiguous_ref`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: '`unauthorized`: sign in again or check the API key.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: |
        `refused` (policy; see `details.policy`), `permission_denied`,
        `impersonation_read_only` or `surface_unverified`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: '`not_found`: no such space or memory in your spaces.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidTransition:
      description: "`invalid_transition`: the memory's or agent's state doesn't allow this command (keeping a kept memory, pausing a paused agent, anything on a disconnected one)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    EditClash:
      description: '`edit_clash`: the memory changed since you read it. Reload and try again.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    IdempotencyKeyReused:
      description: '`idempotency_key_reused`: send a new key for a new command.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionRequired:
      description: '`precondition_required`: send `If-Match` with the version you started from.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: '`rate_limited`: wait for `Retry-After` seconds.'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: '`internal_error`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: |
        `busy` (another change holds the memory; `Retry-After` is set) or
        `unavailable` (the record is not configured on this server).
      headers:
        Retry-After:
          description: Seconds to wait before retrying; set for `busy`.
          schema:
            type: string
            pattern: '^[0-9]+$'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    # ------------------------------------------------------------------
    # Scalars
    # ------------------------------------------------------------------
    Id:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    SpaceKey:
      description: A space's id or slug.
      type: string
      minLength: 1
      maxLength: 255
    MemoryRef:
      description: A display ID (M-0219) or a memory id.
      type: string
      pattern: '^(?:[Mm]-[0-9]{1,18}|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
    DisplayRef:
      description: A memory's display ID, unique within its tenant.
      type: string
      pattern: '^M-[0-9]{4,18}$'
    VersionTag:
      description: A memory version as an entity tag, `"3"`. A bare `3` is accepted too.
      type: string
      pattern: '^(?:"[0-9]{1,9}"|[0-9]{1,9})$'
    Cursor:
      description: Opaque. Pass it back as `cursor`.
      type: string
    Reason:
      description: Why. It goes into the receipt, and is redacted if the memory is forgotten.
      type: string
      maxLength: 2000
    SessionRef:
      description: The agent session the command came from, if any.
      type: string
      maxLength: 255
    Section:
      description: Where a memory sits in the Brief.
      type: string
      enum: [decisions, conventions, preferences, open_question]
    MemoryKind:
      type: string
      enum: [fact, decision]
    State:
      description: |
        The one state people see, derived from `lifecycle` and `flags`:
        forgotten > conflict > stale > proposed > merged > faded > kept.
        `rejected` is internal and carries no mark.
      type: string
      enum: [proposed, kept, merged, stale, conflict, faded, forgotten, rejected]
    Lifecycle:
      type: string
      enum: [proposed, kept, merged, faded, forgotten, rejected]
    Flag:
      type: string
      enum: [conflict, stale]
    Trust:
      description: |
        The class of a source, and of a memory (the lowest of its sources),
        highest first. `external` is quarantined.
      type: string
      enum: [person, agent_own_work, repository, external]
    SourceKind:
      type: string
      enum: [session, pr, file, url, issue, email, note, import]
    SpaceKind:
      type: string
      enum: [personal, project, team]
    Role:
      type: string
      enum: [owner, member, viewer]
    Autonomy:
      description: |
        What an agent may do in a space. `read` writes nothing; `propose`
        sends its writes to Review; `write` keeps them, still with a
        receipt (and still proposes what cites an outside source).
      type: string
      enum: [read, propose, write]
    AgentKind:
      description: Which agent a connection is. `other` is any agent Memax doesn't know by name.
      type: string
      enum: [claude-code, codex, cursor, chatgpt, claude, gemini-cli, copilot, opencode, windsurf, other]
    AgentSurface:
      description: Where the agent runs.
      type: string
      enum: [cli, ide, cloud, chat]
    AgentState:
      description: |
        `active`; `paused` (it only reads until resumed); `disconnected`
        (for good, its credential revoked).
      type: string
      enum: [active, paused, disconnected]
    CredentialKind:
      type: string
      enum: [api_key, oauth_grant]
    ActorKind:
      type: string
      enum: [person, agent, dream, memax, repository]
    Via:
      description: The surface a change came through.
      type: string
      enum: [web, cli, mcp, review, api, email, slack, github, linear, import, system]
    Assurance:
      description: |
        For keeps, and a person's changes to an agent connection:
        `human_web` when Memax verified the person was on the web app,
        `client_attested` when a client (the CLI, an agent) says a person did.
      type: string
      enum: [human_web, client_attested]
    ReceiptAction:
      description: |
        The past-tense verb a receipt records. An agent connection's
        receipts (`object_kind: agent`) are connected, autonomy_changed,
        paused, resumed and disconnected.
      type: string
      enum:
        - proposed
        - kept
        - edited
        - rejected
        - merged
        - flagged
        - resolved
        - verified
        - faded
        - restored
        - forgot
        - moved
        - compiled
        - handed_off
        - answered
        - undid
        - connected
        - autonomy_changed
        - paused
        - resumed
        - disconnected
    ObjectKind:
      type: string
      enum: [memory, note, brief, target, compile, handoff, gate, dream, agent, space]
    Outcome:
      description: |
        What a command did. `applied`: it took effect as asked. `proposed`:
        it went to Review. `needs_confirmation`: it went to Review, and the
        agent should ask the person to keep it.
      type: string
      enum: [applied, proposed, needs_confirmation]
    PolicyEffect:
      type: string
      enum: [apply, propose, confirm, refuse]
    PolicyCode:
      description: |
        Why policy decided what it did. Stable; clients localise by it.
        Refusals: unknown_actor, unknown_action, secret_detected, not_member,
        read_only, key_read_only, key_cannot_review, key_cannot_forget,
        person_must_review, person_must_forget, forget_not_allowed,
        external_needs_review, proposal_in_review, agent_not_connected (the
        agent has no connection, or none to this space, so it only reads),
        agent_paused. Refused changes to agents: person_must_manage (only a
        person changes what an agent may do), not_your_agent,
        autonomy_not_allowed, key_max_propose, autonomy_needs_web (raising
        an agent needs a person on the web). Refused or sent to Review:
        viewer, owners_keep, decision_needs_web. Sent to Review: api_key,
        external_source, contradicts_decision, edits_person_kept,
        autonomy_propose, integration, import, system_proposes, repository,
        person_proposed. Confirmation: confirm_in_agent.
      type: string
      enum:
        - unknown_actor
        - unknown_action
        - secret_detected
        - not_member
        - read_only
        - key_read_only
        - key_cannot_review
        - key_cannot_forget
        - person_must_review
        - person_must_forget
        - forget_not_allowed
        - external_needs_review
        - proposal_in_review
        - agent_not_connected
        - agent_paused
        - person_must_manage
        - not_your_agent
        - autonomy_not_allowed
        - key_max_propose
        - autonomy_needs_web
        - viewer
        - owners_keep
        - decision_needs_web
        - api_key
        - external_source
        - contradicts_decision
        - edits_person_kept
        - autonomy_propose
        - integration
        - import
        - system_proposes
        - repository
        - person_proposed
        - confirm_in_agent
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - idempotency_key_required
        - space_required
        - ambiguous_ref
        - unauthorized
        - refused
        - permission_denied
        - impersonation_read_only
        - surface_unverified
        - not_found
        - method_not_allowed
        - invalid_transition
        - edit_clash
        - idempotency_key_reused
        - precondition_required
        - rate_limited
        - internal_error
        - busy
        - unavailable

    # ------------------------------------------------------------------
    # Objects
    # ------------------------------------------------------------------
    Space:
      type: object
      additionalProperties: false
      required: [id, tenant_id, slug, name, kind, role]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        tenant_id:
          description: Who owns the space's record. Display IDs are unique per tenant.
          $ref: '#/components/schemas/Id'
        slug:
          type: string
        name:
          type: string
        kind:
          $ref: '#/components/schemas/SpaceKind'
        role:
          $ref: '#/components/schemas/Role'
        repository:
          description: The repository the space compiles for, if any.
          type: string

    DecisionOption:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 500
        detail:
          type: string
          maxLength: 2000

    Decision:
      description: The extra fields of a memory of kind `decision`.
      type: object
      additionalProperties: false
      properties:
        why:
          type: string
          maxLength: 2000
        options:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/DecisionOption'
        consequences:
          type: string
          maxLength: 2000
        area:
          type: string
          maxLength: 500
        status:
          type: string
          enum: [in_force, superseded, open]

    Source:
      description: Where a memory came from.
      type: object
      additionalProperties: false
      required: [id, kind, ref, locator, external, trust, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          $ref: '#/components/schemas/SourceKind'
        ref:
          description: What people see, e.g. "PR #212" or "go.mod:14".
          type: string
        uri:
          description: The machine locator, e.g. a URL or a repository path.
          type: string
        locator:
          description: Structured position data, e.g. {path, line, commit}.
          type: object
          additionalProperties: true
        external:
          description: Third-party content, quarantined to Review.
          type: boolean
        trust:
          $ref: '#/components/schemas/Trust'
        quote:
          description: The supporting excerpt. Purged when the memory is forgotten.
          type: string
        content_hash:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'

    Memory:
      description: One statement and its state.
      type: object
      additionalProperties: false
      required:
        - id
        - ref
        - space_id
        - tenant_id
        - statement
        - section
        - kind
        - state
        - lifecycle
        - flags
        - trust
        - version
        - conditions
        - scope
        - created_receipt_id
        - last_receipt_id
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        ref:
          $ref: '#/components/schemas/DisplayRef'
        space_id:
          $ref: '#/components/schemas/Id'
        tenant_id:
          $ref: '#/components/schemas/Id'
        statement:
          description: The current version's words. Empty once forgotten.
          type: string
          maxLength: 2000
        section:
          $ref: '#/components/schemas/Section'
        kind:
          $ref: '#/components/schemas/MemoryKind'
        state:
          $ref: '#/components/schemas/State'
        lifecycle:
          $ref: '#/components/schemas/Lifecycle'
        flags:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Flag'
        trust:
          $ref: '#/components/schemas/Trust'
        version:
          description: The statement's version; also the `ETag`.
          type: integer
          minimum: 1
        stale_after:
          $ref: '#/components/schemas/Timestamp'
        conditions:
          description: '"Stays true while" conditions.'
          type: array
          items: true
        decision:
          $ref: '#/components/schemas/Decision'
        scope:
          description: 'Where it applies, e.g. {"paths": ["packages/web/**"]}.'
          type: object
          additionalProperties: true
        valid_from:
          $ref: '#/components/schemas/Timestamp'
        valid_to:
          $ref: '#/components/schemas/Timestamp'
        created_receipt_id:
          $ref: '#/components/schemas/Id'
        last_receipt_id:
          $ref: '#/components/schemas/Id'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        sources:
          description: Present when one memory is read and it cites sources.
          type: array
          items:
            $ref: '#/components/schemas/Source'

    MemoryVersion:
      description: One version of a memory's statement.
      type: object
      additionalProperties: false
      required: [version, statement, receipt_id, created_at]
      properties:
        version:
          type: integer
          minimum: 1
        statement:
          description: Empty once the memory is forgotten.
          type: string
        receipt_id:
          description: The receipt that wrote this version.
          $ref: '#/components/schemas/Id'
        created_at:
          $ref: '#/components/schemas/Timestamp'

    ReceiptSource:
      description: Where a change came from. A pointer, never a quote.
      type: object
      additionalProperties: false
      required: [kind, ref]
      properties:
        kind:
          type: string
        ref:
          type: string

    Receipt:
      description: One entry of the append-only log. Never holds memory text.
      type: object
      additionalProperties: false
      required:
        - id
        - seq
        - tenant_id
        - space_id
        - object_kind
        - object_id
        - object_ref
        - action
        - actor_kind
        - via
        - occurred_at
        - recorded_at
        - stream_id
        - stream_version
      properties:
        id:
          $ref: '#/components/schemas/Id'
        seq:
          description: Position in the log.
          type: integer
          format: int64
          minimum: 1
        tenant_id:
          $ref: '#/components/schemas/Id'
        space_id:
          $ref: '#/components/schemas/Id'
        object_kind:
          $ref: '#/components/schemas/ObjectKind'
        object_id:
          $ref: '#/components/schemas/Id'
        object_ref:
          type: string
        action:
          $ref: '#/components/schemas/ReceiptAction'
        actor_kind:
          $ref: '#/components/schemas/ActorKind'
        actor_id:
          description: The person, or the agent's credential. Absent for Dream, Memax and the repository.
          $ref: '#/components/schemas/Id'
        agent:
          description: The agent the change came through, e.g. claude-code.
          type: string
        via:
          $ref: '#/components/schemas/Via'
        assurance:
          $ref: '#/components/schemas/Assurance'
        session_ref:
          type: string
        source:
          $ref: '#/components/schemas/ReceiptSource'
        reason:
          description: Why, if given. Redacted when the memory is forgotten.
          type: string
        occurred_at:
          description: When it happened on the client.
          $ref: '#/components/schemas/Timestamp'
        recorded_at:
          description: When the server recorded it.
          $ref: '#/components/schemas/Timestamp'
        stream_id:
          $ref: '#/components/schemas/Id'
        stream_version:
          type: integer
          minimum: 1

    PolicyDecision:
      description: Why a command had the outcome it did.
      type: object
      additionalProperties: false
      required: [effect]
      properties:
        effect:
          $ref: '#/components/schemas/PolicyEffect'
        code:
          $ref: '#/components/schemas/PolicyCode'
        message:
          description: An English sentence; localise by `code`.
          type: string
        quarantine:
          description: External content, held with the ochre notice.
          type: boolean

    CommandResult:
      type: object
      additionalProperties: false
      required: [outcome, policy, memory, receipts]
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        policy:
          $ref: '#/components/schemas/PolicyDecision'
        memory:
          description: |
            The memory's current projection. For an edit sent to Review, the
            new proposal.
          $ref: '#/components/schemas/Memory'
        receipts:
          description: The receipts the command wrote, oldest first.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Receipt'

    MemoryDetail:
      type: object
      additionalProperties: false
      required: [memory, versions, receipts]
      properties:
        memory:
          $ref: '#/components/schemas/Memory'
        versions:
          description: Every version of the statement, newest first.
          type: array
          items:
            $ref: '#/components/schemas/MemoryVersion'
        receipts:
          $ref: '#/components/schemas/ReceiptPage'

    SpaceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Space'

    MemoryPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Memory'
        has_more:
          type: boolean
        next_cursor:
          $ref: '#/components/schemas/Cursor'

    ReviewPage:
      type: object
      additionalProperties: false
      required: [items, has_more, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Memory'
        has_more:
          type: boolean
        next_cursor:
          $ref: '#/components/schemas/Cursor'
        total:
          description: How many memories are waiting, across every page.
          type: integer
          minimum: 0

    ReceiptPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Receipt'
        has_more:
          type: boolean
        next_cursor:
          $ref: '#/components/schemas/Cursor'

    AgentCredential:
      description: The credential a connection is bound to.
      type: object
      additionalProperties: false
      required: [kind, id, active]
      properties:
        kind:
          $ref: '#/components/schemas/CredentialKind'
        id:
          description: The API key's or OAuth grant's id.
          $ref: '#/components/schemas/Id'
        active:
          description: False once the credential is revoked, expired or deleted.
          type: boolean

    AgentSpace:
      description: A connection's autonomy in one space, and its use there.
      type: object
      additionalProperties: false
      required: [space_id, slug, name, kind, autonomy, reads_7d, writes_7d, updated_at]
      properties:
        space_id:
          $ref: '#/components/schemas/Id'
        slug:
          type: string
        name:
          type: string
        kind:
          $ref: '#/components/schemas/SpaceKind'
        autonomy:
          $ref: '#/components/schemas/Autonomy'
        reads_7d:
          description: Reads in the last 7 days. 0 until reads are recorded.
          type: integer
          minimum: 0
        writes_7d:
          description: Memories it proposed, kept or edited in the last 7 days.
          type: integer
          minimum: 0
        updated_at:
          description: When its autonomy here last changed.
          $ref: '#/components/schemas/Timestamp'

    AgentConnection:
      description: |
        An agent working for a person through one credential: the identity
        its receipts name, and its autonomy in each space.
      type: object
      additionalProperties: false
      required:
        - id
        - person_id
        - agent
        - display_name
        - surface
        - credential
        - max_autonomy
        - state
        - spaces
        - reads_7d
        - writes_7d
        - created_receipt_id
        - last_receipt_id
        - created_at
        - updated_at
      properties:
        id:
          description: The connection's id; receipts of its writes carry it as `actor_id`.
          $ref: '#/components/schemas/Id'
        person_id:
          description: The person it works for.
          $ref: '#/components/schemas/Id'
        agent:
          $ref: '#/components/schemas/AgentKind'
        display_name:
          type: string
        surface:
          $ref: '#/components/schemas/AgentSurface'
        credential:
          $ref: '#/components/schemas/AgentCredential'
        max_autonomy:
          description: |
            The most its credential allows: an API key proposes at most, and
            a credential without write access (or one no longer active) only
            reads.
          $ref: '#/components/schemas/Autonomy'
        client_id:
          description: The OAuth client's Client ID Metadata Document URL, when it has one.
          type: string
        state:
          $ref: '#/components/schemas/AgentState'
        spaces:
          description: |
            The spaces of yours it is connected to, personal space first. In a
            space it isn't connected to, it only reads.
          type: array
          items:
            $ref: '#/components/schemas/AgentSpace'
        reads_7d:
          description: Reads in the last 7 days, in those spaces. 0 until reads are recorded.
          type: integer
          minimum: 0
        writes_7d:
          description: Writes in the last 7 days, in those spaces.
          type: integer
          minimum: 0
        last_seen_at:
          description: When it last used Memax (updated at most once a minute).
          $ref: '#/components/schemas/Timestamp'
        connected_by_kind:
          description: Who connected it (`memax` for a V1 credential carried over), when you can see that receipt.
          $ref: '#/components/schemas/ActorKind'
        connected_by:
          description: The person who connected it.
          $ref: '#/components/schemas/Id'
        disconnected_at:
          $ref: '#/components/schemas/Timestamp'
        created_receipt_id:
          $ref: '#/components/schemas/Id'
        last_receipt_id:
          $ref: '#/components/schemas/Id'
        created_at:
          description: When it was connected.
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    AgentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentConnection'

    AgentWeek:
      description: |
        What the agent did in the last 7 days, in your spaces: its writes,
        and what became of the memories it wrote.
      type: object
      additionalProperties: false
      required: [reads, writes, proposals, kept, rejected, waiting]
      properties:
        reads:
          description: 0 until reads are recorded.
          type: integer
          minimum: 0
        writes:
          description: Memories it proposed, kept or edited.
          type: integer
          minimum: 0
        proposals:
          description: Memories it wrote that went to Review.
          type: integer
          minimum: 0
        kept:
          description: Memories it wrote that are kept now.
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
        waiting:
          description: Memories it wrote that are still waiting in Review.
          type: integer
          minimum: 0

    AgentSession:
      description: One of the agent's sessions, from the session on its receipts.
      type: object
      additionalProperties: false
      required: [session_ref, reads, writes, last_at]
      properties:
        session_ref:
          $ref: '#/components/schemas/SessionRef'
        reads:
          description: 0 until reads are recorded.
          type: integer
          minimum: 0
        writes:
          type: integer
          minimum: 0
        last_at:
          $ref: '#/components/schemas/Timestamp'

    AgentDetail:
      type: object
      additionalProperties: false
      required: [agent, this_week, recent_writes, sessions]
      properties:
        agent:
          $ref: '#/components/schemas/AgentConnection'
        this_week:
          $ref: '#/components/schemas/AgentWeek'
        recent_writes:
          description: Its latest receipts on memories, newest first (at most 10). Read a memory for its words.
          type: array
          items:
            $ref: '#/components/schemas/Receipt'
        sessions:
          description: Its latest sessions, most recent first (at most 10).
          type: array
          items:
            $ref: '#/components/schemas/AgentSession'

    AgentCommandResult:
      type: object
      additionalProperties: false
      required: [outcome, policy, agent, receipts]
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        policy:
          $ref: '#/components/schemas/PolicyDecision'
        agent:
          description: The connection after the change.
          $ref: '#/components/schemas/AgentConnection'
        receipts:
          description: |
            The receipts the command wrote, oldest first: one per space the
            change applies to, or none when there was nothing to change.
          type: array
          items:
            $ref: '#/components/schemas/Receipt'

    # ------------------------------------------------------------------
    # Requests
    # ------------------------------------------------------------------
    SourceInput:
      description: A source a new memory cites.
      type: object
      additionalProperties: false
      required: [kind, ref]
      properties:
        kind:
          $ref: '#/components/schemas/SourceKind'
        ref:
          description: What people see, e.g. "PR #212".
          type: string
          minLength: 1
          maxLength: 500
        uri:
          type: string
          maxLength: 2048
        locator:
          type: object
          additionalProperties: true
        external:
          description: |
            Third-party content. URL, email and issue sources are external
            whatever this says.
          type: boolean
        quote:
          description: The supporting excerpt.
          type: string
          maxLength: 4000
        content_hash:
          type: string
          maxLength: 255

    RememberRequest:
      type: object
      additionalProperties: false
      required: [statement, section]
      properties:
        statement:
          description: One fact, in your words.
          type: string
          minLength: 1
          maxLength: 2000
        section:
          $ref: '#/components/schemas/Section'
        kind:
          description: Defaults to fact.
          $ref: '#/components/schemas/MemoryKind'
        decision:
          description: Only for kind decision.
          $ref: '#/components/schemas/Decision'
        sources:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/SourceInput'
        stale_after:
          description: When it should be verified again.
          $ref: '#/components/schemas/Timestamp'
        conditions:
          description: '"Stays true while" conditions.'
          type: array
          items: true
        scope:
          description: 'Where it applies, e.g. {"paths": ["packages/web/**"]}.'
          type: object
          additionalProperties: true
        valid_from:
          $ref: '#/components/schemas/Timestamp'
        valid_to:
          $ref: '#/components/schemas/Timestamp'
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          description: When it happened on the client; offline queues keep the original time.
          $ref: '#/components/schemas/Timestamp'
        session_ref:
          $ref: '#/components/schemas/SessionRef'

    ReviewRequest:
      description: The body of keep and reject. Every field is optional.
      type: object
      additionalProperties: false
      properties:
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          description: When it happened on the client; offline queues keep the original time.
          $ref: '#/components/schemas/Timestamp'
        session_ref:
          $ref: '#/components/schemas/SessionRef'

    AutonomyRequest:
      type: object
      additionalProperties: false
      required: [autonomy]
      properties:
        autonomy:
          $ref: '#/components/schemas/Autonomy'
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          description: When it happened on the client; offline queues keep the original time.
          $ref: '#/components/schemas/Timestamp'

    AgentCommandRequest:
      description: The body of pause, resume and disconnect. Every field is optional.
      type: object
      additionalProperties: false
      properties:
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          description: When it happened on the client; offline queues keep the original time.
          $ref: '#/components/schemas/Timestamp'

    EditRequest:
      type: object
      additionalProperties: false
      required: [statement]
      properties:
        statement:
          description: The new words.
          type: string
          minLength: 1
          maxLength: 2000
        section:
          description: Moves the memory; omit to leave it where it is.
          $ref: '#/components/schemas/Section'
        keep:
          description: Also keep a proposal after editing it (Review's edit and keep).
          type: boolean
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          description: When it happened on the client; offline queues keep the original time.
          $ref: '#/components/schemas/Timestamp'
        session_ref:
          $ref: '#/components/schemas/SessionRef'

    # ------------------------------------------------------------------
    # Envelopes
    # ------------------------------------------------------------------
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          description: What went wrong and what to do, in English.
          type: string
        details:
          $ref: '#/components/schemas/ErrorDetails'

    ErrorDetails:
      description: Machine-readable context; which keys appear depends on `code`.
      type: object
      additionalProperties: false
      properties:
        field:
          description: The field that is wrong (`invalid_request`).
          type: string
        policy:
          description: The policy decision (`refused`).
          $ref: '#/components/schemas/PolicyDecision'
        ref:
          description: The memory's display ID (`edit_clash`, `invalid_transition`).
          type: string
        expected_version:
          description: The version you sent (`edit_clash`).
          type: integer
        current_version:
          description: The memory's version now (`edit_clash`).
          type: integer
        retry_after:
          description: Seconds to wait (`rate_limited`, `busy`).
          type: integer
        limit:
          description: The rate limit (`rate_limited`).
          type: integer
        current:
          description: Requests counted so far (`rate_limited`).
          type: integer
        reset_at:
          description: When the window resets (`rate_limited`).
          $ref: '#/components/schemas/Timestamp'

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'

    SpaceListEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SpaceList'

    MemoryPageEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MemoryPage'

    ReviewPageEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ReviewPage'

    ReceiptPageEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ReceiptPage'

    MemoryDetailEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MemoryDetail'

    CommandResultEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CommandResult'

    AgentListEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AgentList'

    AgentDetailEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AgentDetail'

    AgentCommandResultEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AgentCommandResult'
