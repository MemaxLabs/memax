  /v2/targets/{target}/runs:
    parameters:
      - $ref: '#/components/parameters/TargetPath'
    get:
      operationId: listCompileRuns
      tags: [targets]
      summary: List a target's compile runs
      description: Every compile run (`C-`) of the target, newest first, failed ones included.
      parameters:
