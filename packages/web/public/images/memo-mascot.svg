<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Memo — memax's mascot. A memory card that came alive. -->

  <!-- Shadow -->
  <ellipse cx="64" cy="118" rx="28" ry="6" fill="#000" opacity="0.06"/>

  <!-- Body — rounded rectangle, like a ghost card -->
  <rect x="24" y="16" width="80" height="88" rx="20" ry="20" fill="#F0EDE8" stroke="#D8D3CB" stroke-width="1.5"/>

  <!-- Inner glow -->
  <rect x="28" y="20" width="72" height="80" rx="17" ry="17" fill="#F7F5F2" opacity="0.6"/>

  <!-- Eyes — agent-colored dots, asymmetric for personality -->
  <circle cx="44" cy="52" r="6" fill="#2C2C2C"/>
  <circle cx="78" cy="52" r="6" fill="#2C2C2C"/>

  <!-- Eye highlights -->
  <circle cx="46" cy="50" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="80" cy="50" r="2" fill="#fff" opacity="0.8"/>

  <!-- Subtle smile — just a gentle curve -->
  <path d="M50 68 Q64 76 78 68" fill="none" stroke="#2C2C2C" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- Agent dot — the source indicator, like on ghost cards -->
  <circle cx="36" cy="34" r="3.5" fill="#DA7756" opacity="0.7"/>

  <!-- Tiny feet — sticking out from under the card -->
  <rect x="38" y="96" width="12" height="14" rx="6" fill="#F0EDE8" stroke="#D8D3CB" stroke-width="1.5"/>
  <rect x="62" y="96" width="12" height="14" rx="6" fill="#F0EDE8" stroke="#D8D3CB" stroke-width="1.5"/>
</svg>
