# Memax compile service — STAGING
# Deploy from the REPOSITORY ROOT (the image builds packages/compiler too):
#   fly deploy . -c packages/compile-service/fly/fly.compile.staging.toml
#
# Internal only. There is no [http_service] and no [[services]], so Fly's
# proxy never routes public traffic here; never run `fly ips allocate` on
# this app. The API server and the worker reach it over the private
# network at http://memax-compile-staging.internal:8080
# (COMPILE_SERVICE_URL in packages/server/fly/*.staging.toml).
#
# Sister file: fly.compile.production.toml.
app = "memax-compile-staging"
primary_region = "sjc"
# main.ts drains on SIGTERM: health answers 503, in-flight requests get
# SHUTDOWN_GRACE_MS, then it exits. Fly waits kill_timeout before SIGKILL.
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  # Paths are relative to THIS toml: the Dockerfile and its ignore file
  # sit in packages/compile-service/.
  dockerfile = "../Dockerfile"
  ignorefile = "../Dockerfile.dockerignore"

[env]
  PORT = "8080"
  # Fly's private network (6PN) is IPv6; "::" also accepts IPv4.
  HOST = "::"
  SHUTDOWN_GRACE_MS = "10000"

[deploy]
  strategy = "rolling"

# Machine checks (no service to attach them to): a rolling deploy waits
# for the new machine to pass before it stops the old one.
[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/health"
    method = "get"
    interval = "15s"
    timeout = "3s"
    grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
