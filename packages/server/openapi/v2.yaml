# SPDX-License-Identifier: Apache-2.0
#
# The /v2 contract. This file is the source of truth: the Go handlers are
# tested against it (internal/contract), and the SDK's v2 types are generated
# from it (packages/sdk, `pnpm --filter memax-sdk gen:v2`). It is licensed
# Apache-2.0, unlike the rest of packages/server, so the Apache-2.0 SDK and
# CLI can carry types generated from it.
#
# Conventions the contract tests enforce (internal/contract/lint.go):
#   - every object schema with properties sets additionalProperties: false;
#   - every response body is a named schema: an envelope with `data`, or
#     ErrorEnvelope for 4xx and 5xx;
#   - every POST and PATCH requires Idempotency-Key, except a POST marked
#     `x-memax-read: true`, which only reads (it is a POST to keep its
#     input out of URLs);
#   - every operation documents 401, 429, 500 and 503.
openapi: 3.1.1
info:
  title: Memax API v2
  version: 2.0.0-alpha.1
  summary: The record your agents read from, with a receipt for every change.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    The `/v2` API reads and changes the V2 record: memories, their versions,
    sources and receipts, the Brief, and the targets it compiles to, in the
    spaces you belong to.

    ## Envelope

    Every response is JSON. A success carries `{"data": …}`. An error carries
    `{"error": {"code", "message", "details"}}`. `code` is stable and
    machine-readable; `message` is an English sentence that says what to do.

    ## Commands

    A command is a `POST` (or the `PATCH` that sets an agent's autonomy or
    changes a target) that changes the record: remember, keep, edit and
    reject a memory; settle a conflict; undo a decision; ask, answer and
    withdraw a decision gate; pause, resume,
    disconnect and set the autonomy of an agent; revise the Brief; add,
    change and compile a target; acknowledge a delivery, report a hand
    edit, and pull, overwrite or stop it. Every command:

    - needs an `Idempotency-Key` header (1 to 255 characters). Retrying a
      command with the same key returns the original result and writes
      nothing; the response then carries `Idempotent-Replayed: true`. A key
      reused for a different command or different content is refused with
      422 `idempotency_key_reused`.
    - writes one or more receipts in the same transaction. A receipt never
      holds the memory's words.
    - is decided by policy, not by the client. A person who is a member or
      owner keeps what they remember; a viewer's words, an agent's and an API
      key's go to Review as proposals. `policy` in the result says why.
      Agents propose and people keep: an API key can never keep or reject.

    A refusal is 403 `refused` with `details.policy`; clients localise by
    `details.policy.code` and fall back to `details.policy.message`.

    One `POST` is not a command: the near-duplicate check
    (`:near-duplicates`) only reads. It is a `POST` so a draft travels in
    the body rather than a URL, and it takes no `Idempotency-Key`
    (`x-memax-read: true`).

    ## Versions and If-Match

    A memory's `version` is the version of its statement. Reads return it in
    the body and in the `ETag` header (`"3"`). Edits require
    `If-Match: "<version>"`; a stale version is 412 `edit_clash`. Keep and
    reject accept `If-Match` too, so a person never keeps words they haven't
    seen.

    ## Who made a change, and how sure Memax is

    A session token acts as the person; an API key or OAuth grant acts as
    the agent connection it is bound to. A person's keep records an
    assurance: `human_web` when Memax can tell the person was on the web
    app, `client_attested` otherwise (the CLI, an agent, any other client).
    Memax tells by two things together: the session was issued to the web
    app, and the web app's server-side proxy signed the request
    (`X-Memax-Surface-*` headers). Other clients must not send those
    headers; a request that carries them and doesn't verify is refused
    with 403 `surface_unverified`. Quarantined proposals, decisions in
    spaces where they need a person on the web (team spaces by default),
    and raising what an agent may do all need `human_web`.

    ## The Brief and its targets

    A space has one Brief, in versions (`B-`): ordered sections of memory
    items and cited prose. Every change that affects what compiles (a Keep,
    new words for a kept memory, a Brief version, a target's settings)
    recompiles the space's targets within seconds. Each compile is a run
    (`C-`). A file target is in sync once a device acknowledges the run on
    disk; Memax never writes over a file edited by hand. A device reports
    such an edit, and a person pulls it back as proposals, overwrites it,
    or stops compiling the file. A pulled file is held, as it is, until
    each of its proposals is kept or rejected.

    ## The judge

    Every proposal is judged within seconds of being written: a repeat of a
    kept memory is folded into it (`merged`, with a `merged_into` link), a
    repeat of something rejected in the last 90 days is folded into that
    rejection, an update links to the memory it updates (`updates`, so
    Review can show a diff), and a contradiction of a decision in force is
    flagged as a conflict (`flags: ["conflict"]`, with a `conflicts_with`
    link) before anyone can keep it. Until the judge has run, a proposal's
    `judge.state` is `working`. A conflict is settled with
    `:resolve-conflict`; `GET /v2/memories/{ref}/conflict` shows both sides
    and the four answers.

    ## Undo

    `POST /v2/receipts/{receipt}:undo` undoes the command that wrote the
    receipt: a person's keep, reject, edit or conflict resolution (theirs
    only, within 10 minutes), or one of the judge's folds (any person who
    may keep, within 14 days). It is refused with 409 `undo_refused` when
    the window has passed, it was already undone, a later change depends on
    it, or the receipt's command can't be undone (`details.reason`).

    ## Decision gates

    An agent that may propose can stop and ask a person to decide: a gate
    (`G-`), with a question, its context and two to four options. A person
    answers with one option, and the answer is kept, in the same command,
    as a decision the person authored (a memory of kind `decision`), which
    every target then compiles. Answering follows Keep's rules for a
    decision: members and owners, and in spaces where decisions need a
    person on the web (team spaces by default) only on the web, so the CLI
    and in-agent answers are refused there and the gate keeps waiting. The
    agent that asked, the person it works for, or anyone who could answer
    may withdraw a waiting gate. A gate waits until its `expires_at`
    (7 days unless the agent says otherwise), then reads as `expired`. The
    agent hears how it ended in its next MCP recall.

    ## Sealed receipts

    Receipts are sealed into a hash chain per space, off the write path,
    within seconds of being written: every receipt, in order, chained by
    SHA-256 and cut into checkpoints, each with a Merkle root of its
    receipts, the chain hash at its end and an Ed25519 signature
    (`GET /v2/spaces/{space}/checkpoints`, with the public keys). Changing,
    removing or reordering a sealed receipt breaks the chain. A sealed
    receipt holds a salted hash of its reason, not the reason, so Forget
    can redact the reason and the chain still verifies; the redaction is
    itself a receipt (`forgot`). The SDK's `verifyReceiptChain` checks an
    export against its checkpoints.

    ## Reads

    What agents read is recorded as reads (`R-`), not receipts: a read
    changes nothing. Memax records them after the response, in batches, so
    reading is never slower for it, and under heavy load a read may go
    uncounted rather than wait. A read holds who read, which memories or
    which compile, how, and when; never the memories' words or the query.
    A session-start hook reports the compile its agent loaded natively
    (`POST /v2/spaces/{space}/compile-loads`), which counts as a read of
    every fact in it. A memory's `reads` say how often it was read and by
    which agents, and whether it is in a file whose loads Memax can't see.

    ## Imports

    `memax init` reads what agents already know from their files, splits
    it into statements on your machine (secrets and hidden characters never
    leave it) and uploads them (`POST /v2/spaces/{space}/imports`). Every
    statement arrives as a proposal with its `file:line`, through the import
    surface (`via: import`); repeats fold into one proposal and what the
    space already has is skipped. The judge looks at each proposal, and the
    import's conflict check groups the ones that disagree, flagged as
    conflicts and settled once, as a group. Nothing is kept until a person
    keeps it: one by one, in bulk (`memories:keep`), or by settling.

    ## Device sign-in

    Where no browser can open (over SSH, in a container), `memax login`
    and `memax init` sign in with a device code (RFC 8628). The CLI asks
    the OAuth server for one (`POST /oauth/device_authorization`, outside
    /v2) and shows a short code and memax.app/device; the person, signed in
    on the web app, checks the code against the terminal and confirms it
    (`/v2/device-authorizations:approve`); the CLI, polling `POST
    /oauth/token` with the `urn:ietf:params:oauth:grant-type:device_code`
    grant, collects a CLI session once. Codes last 10 minutes and are
    decided once.

    ## Display IDs

    `M-0219` is unique within a tenant, not across tenants, so a display ID
    always travels with its space: `GET /v2/memories/M-0219?space=memax-v2`.
    A memory's uuid (`id`) needs no space. Gates work the same way
    (`GET /v2/gates/G-0012?space=memax-v2`).

    ## Not found, never forbidden

    A space or memory outside your spaces is 404, the same as one that doesn't
    exist, so the API never confirms that something exists.

    ## Pagination

    Lists return `{"items", "has_more", "next_cursor"}`, newest first unless
    the operation says otherwise. Pass `next_cursor` back as `cursor`.
    Cursors are opaque and belong to the list that issued them.

    ## Errors

    | Status | Code | When |
    | --- | --- | --- |
    | 400 | `invalid_request` | The request is malformed; `details.field` names the field. |
    | 400 | `idempotency_key_required` | A command came without `Idempotency-Key`. |
    | 400 | `space_required` | A display ID came without `?space=`. |
    | 400 | `ambiguous_ref` | A display ID matches memories in more than one space. |
    | 401 | `unauthorized` | No valid credential. |
    | 403 | `refused` | Policy refused the command; see `details.policy`. |
    | 403 | `permission_denied` | The credential can't read memories at all. |
    | 403 | `impersonation_read_only` | An impersonated session tried a command. |
    | 403 | `surface_unverified` | A request claimed to come from the web app, and its signature didn't verify. |
    | 404 | `not_found` | No such space or memory in your spaces. |
    | 405 | `method_not_allowed` | The path exists, the method doesn't. |
    | 409 | `invalid_transition` | The memory's (or target's, or gate's) state doesn't allow the command. |
    | 409 | `undo_refused` | The command can't be undone; `details.reason` says why. |
    | 412 | `edit_clash` | `If-Match` is not the memory's current version. |
    | 422 | `idempotency_key_reused` | The key was used for a different command. |
    | 428 | `precondition_required` | An edit (or a Brief revision) came without `If-Match`. |
    | 429 | `rate_limited` | Too many requests; see `Retry-After`. |
    | 500 | `internal_error` | Something failed on our side. |
    | 503 | `busy` | Another change holds the memory; see `Retry-After`. |
    | 503 | `unavailable` | The record is not configured on this server. |
servers:
  - url: https://api.memax.app
security:
  - bearer: []
tags:
  - name: spaces
    description: The spaces you belong to.
  - name: imports
    description: What agents already know, read from their files by `memax init`, arriving as proposals.
  - name: memories
    description: One statement each, under a seal.
  - name: review
    description: What needs a person.
  - name: activity
    description: The receipts of every change.
  - name: agents
    description: The agents connected to your spaces, and what each may do in each.
  - name: briefs
    description: The Brief every agent reads, in versions.
  - name: targets
    description: Where a space compiles to, its compile runs, deliveries and hand edits.
  - name: gates
    description: Decisions agents ask people to make, and the answers, kept as decisions.
  - name: reads
    description: What agents read (R-). Reads are not receipts.
  - name: devices
    description: Signing the memax CLI in on a machine with no browser, with a code you confirm on the web.
  - name: ask
    description: Cited answers from a space's kept memories, for people.
paths:
  /v2/spaces:
    get:
      operationId: listSpaces
      tags: [spaces]
      summary: List your spaces
      description: Every space you belong to, with your role in it. Not paginated.
      responses:
        '200':
          description: Your spaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

    post:
      operationId: createSpace
      tags: [spaces]
      summary: Create a project space
      description: |
        Creates a project space on the V2 record, owned by you: `memax init`
        does this for a repository that has no space yet. Without a `slug`,
        the name's slug is used, with a number added when it is taken; a
        slug you name must be free (409 `slug_taken`). Only a signed-in
        person creates spaces, and here only project spaces: your personal
        space exists already, and team spaces come with Team. A space isn't
        part of its own record, so creating one writes no receipt; its
        Activity starts with its first change. The same `Idempotency-Key`
        finds the space the first call created.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpaceRequest'
      responses:
        '201':
          description: The space, with you as its owner.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/SpaceConflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/spaces/{space}:switch:
    parameters:
      - $ref: '#/components/parameters/SpacePath'
    post:
      operationId: switchSpace
      tags: [spaces]
      summary: Switch an empty space to the V2 record
      description: |
        Moves a space that holds no V1 memories to the V2 record, so agents
        are served from it over MCP too: a new person's personal space, say,
        before `memax init` brings machine-local memory into it. A space
        with V1 memories switches in the app, where they are cleaned up
        first (409 `space_has_notes`, with `details.notes`). Only the
        space's owner may. A space already on V2 is returned as it is.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Via'
      responses:
        '200':
          description: The space, on the V2 record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SpaceConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v2/spaces/{space}/memories:
    parameters:
      - $ref: '#/components/parameters/SpacePath'
    post:
      operationId: rememberMemory
      tags: [memories]
      summary: Remember a statement
      description: |
        Writes one statement to the space. Policy decides what happens: a
        member or owner keeps it (`outcome: applied`); a viewer, an agent or
        an API key proposes it (`outcome: proposed`), and it waits in Review.
        An agent's statement that cites an external source is always
        proposed and quarantined (`policy.quarantine`). A statement that
        contains a credential is refused.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RememberRequest'
      responses:
        '201':
          description: The memory was written, kept or proposed.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      operationId: listMemories
      tags: [memories]
      summary: List memories
      description: |
        The space's memories, newest first. Without `state`, every state
        except `rejected` is listed. Sources are not included; read one
        memory for its sources.
      parameters:
        - name: state
          in: query
          description: Only these displayed states. Repeat for more than one.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/State'
        - name: section
          in: query
          description: Only these sections. Repeat for more than one.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Section'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of memories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryPageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/spaces/{space}/memories:near-duplicates:
    parameters:
      - $ref: '#/components/parameters/SpacePath'
    post:
      operationId: findNearDuplicates
      tags: [memories]
      summary: Find what a draft repeats
      x-memax-read: true
      description: |
        Remember's near-duplicate check: the kept memories and pending
        proposals of the space that a draft statement repeats, best first,
        so a person can keep an agent's proposal instead of writing the
        same thing twice. `exact` is the same words (case, spacing and
        punctuation aside); `near` is at least `floor` similar by embedding
        (cosine). Superseded decisions are left out.

        No model runs on this path. The draft is embedded (within about
        120 ms) and compared exactly with the space's stored embeddings,
        so it answers in under 150 ms. When embeddings are off on this
        server, or the draft's embedding misses its deadline, only exact
        repeats are checked and `semantic` is `false`.

        It only reads, so any credential that reads the space may call it.
        It is a `POST` so the draft travels in the body, never in a URL or
        an access log, and it takes no `Idempotency-Key`. Clients call it
        while a person types (debounced), and it is rate-limited per
        caller: 429 `rate_limited` with `Retry-After`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NearDuplicatesRequest'
      responses:
        '200':
          description: What the draft repeats, best first; none is an empty list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearDuplicatesEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/spaces/{space}/memories:keep:
    parameters:
      - $ref: '#/components/parameters/SpacePath'
    post:
      operationId: keepMemories
      tags: [review]
      summary: Keep proposals in bulk
      description: |
        Keeps several proposals of the space, each as its own Keep: its own
        receipt, by Keep's rules, so one that can't be kept (in conflict,
        quarantined outside the web, a decision where decisions need a
        person on the web, not judged yet) is reported and the rest are
        kept. ReviewImport's "Keep 30" and `memax init`'s "keep the ones
        that agree" send the proposals the person chose. Each item's
        `version` is the version the person saw, as `If-Match` is for one
        Keep. Retrying with the same `Idempotency-Key` keeps nothing twice.
        Every target recompiles once the keeps land.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkReviewRequest'
      responses:
        '200':
          description: What happened to each proposal, in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkReviewResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/spaces/{space}/memories:reject:
    parameters:
      - $ref: '#/components/parameters/SpacePath'
    post:
      operationId: rejectMemories
      tags: [review]
      summary: Reject proposals in bulk
      description: |
        Rejects several proposals of the space, each as its own Reject with
        its own receipt, by Reject's rules; one that can't be rejected is
        reported and the rest are. Retrying with the same `Idempotency-Key`
        rejects nothing twice.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkReviewRequest'
      responses:
        '200':
          description: What happened to each proposal, in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkReviewResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/spaces/{space}/ask:
    parameters:
      - $ref: '#/components/parameters/SpacePath'
    post:
      operationId: askSpace
      tags: [ask]
      summary: Ask the space a question
      x-memax-read: true
      description: |
        ⌘K Ask: a short answer to a person's question from the space's kept
        memories, streamed as server-sent events, every sentence cited to
        the memories it rests on.

        The search is the one recall and search use: the space's kept
        memories and decisions in force, never a superseded decision,
        never another space's memory. Quarantined memories (trust
        `external`) are left out of answers; search and Memories still
        show them. The answer tier's model is given the best matches and
        answers only from them, in at most three sentences. A citation of
        anything it wasn't given is removed before it is sent (`dropped`
        counts them). When the memories don't answer the question, or none
        matched, the stream ends with outcome `not_covered` and no words;
        an answer left with no citation ends `unsupported`, and clients
        don't show it as an answer. When answers are off on the server,
        the stream is the matching memories alone (`answering: false`,
        outcome `sources_only`).

        The stream, in order: one `sources` event; then `delta` (words,
        citations removed) and `cite` events interleaved as the answer
        arrives (`cite.n` numbers the cited memories in the order they're
        first cited); then `done`, or `error` if the model failed partway.
        Cancelling the request (closing the connection) stops the model.

        Only a signed-in person who belongs to the space may ask; an agent
        or API key is refused with policy `ask_by_person` (agents read the
        record over MCP). It only reads: it writes no record row and no
        receipt, and takes no `Idempotency-Key`. Each answer the model
        writes counts toward the person's asks this month, and past the
        plan's limit the request is refused with policy `ask_limit`
        (`details.limit`, `details.current`, `details.reset_at`). Asks that
        never reach the model (nothing matched, answers off) don't count.
        To keep an answer, remember it with the cited memories as sources
        of kind `memory`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '200':
          description: 'The answer, as a stream of AskEvent events, sent with `Cache-Control: no-cache`.'
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AskEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
