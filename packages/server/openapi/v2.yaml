      responses:
        '200':
          description: The file matches what Memax delivered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationResultEnvelope'
        '201':
          description: A hand edit, recorded.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/targets/{target}/deliveries:
    parameters:
      - $ref: '#/components/parameters/TargetPath'
    post:
      operationId: recordDelivery
      tags: [targets]
      summary: Acknowledge a delivery
      description: |
        A device acknowledges it wrote a compile run's output: `sha256` is
        the run's drift hash, computed from what was written (for one file,
        the compiler's drift_sha256 of that file; for several, the sha256
        of `<path> NUL <drift_sha256> LF` lines sorted by path). A target is
        in sync once its latest run is delivered. Acknowledging the same run
        again, or an older one, changes nothing. While a pull holds one of
        the run's files (the target is `held`), nothing may be written over
        it: 409.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryRequest'
      responses:
        '200':
          description: The delivery, recorded (or already known).
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/targets/{target}/drift:
    parameters:
      - $ref: '#/components/parameters/TargetPath'
    get:
      operationId: getDrift
      tags: [targets]
      summary: Read a target's hand edits
      description: |
        Each open hand edit of the target (DriftResolve): the file as Memax
        wrote it, the file as it is now, and what the edit says, change by
        change. No open edits is an empty list. 503 when the server has no
        compile service.
      responses:
        '200':
          description: The open hand edits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriftEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/targets/{target}/drift:pull:
    parameters:
      - $ref: '#/components/parameters/TargetPath'
    post:
      operationId: pullDrift
      tags: [targets]
      summary: Pull a hand edit back as proposals
      description: |
        Turns each change of the target's open hand edits into a proposal,
        written by the person on the device (or by the repository, as
        external, when nobody is known), with a `file:line` source: a changed
        cited line proposes an edit of that memory, a new line a new memory.
        A removed cited line waits in the resolution for a person to forget
        or exclude the memory; it is never forgotten automatically. Any
        person in the space may pull.

        The edited file stays as it is until its proposals are decided:
        while any of them is still proposed, the target is `held` and
        nothing is delivered over the file (see `holds` on the target).
        Once each is kept or rejected, the latest compile is delivered over
        it: kept lines come back compiled, rejected ones go. A pull that
        writes no proposal holds nothing; the file stays until the next
        compile delivers over it.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveDriftRequest'
      responses:
        '200':
          $ref: '#/components/responses/DriftResolution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/targets/{target}/drift:overwrite:
    parameters:
      - $ref: '#/components/parameters/TargetPath'
    post:
      operationId: overwriteDrift
      tags: [targets]
      summary: Overwrite a hand edit
      description: |
        Lets Memax write the compiled file over the target's open hand
        edits: the target recompiles and is delivered again. The edit stays
        in the observation, so a copy remains in Activity. People who may
        keep overwrite.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveDriftRequest'
      responses:
        '200':
          $ref: '#/components/responses/DriftResolution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/targets/{target}/drift:stop:
    parameters:
      - $ref: '#/components/parameters/TargetPath'
    post:
      operationId: stopDrift
      tags: [targets]
      summary: Stop compiling a hand-edited target
      description: |
        Stops compiling the target (`off`) and closes its open hand edits;
        the file stays as it is, and agents keep reading the space over MCP.
        Turn it back on with `enabled: true`. People who may keep stop
        targets.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveDriftRequest'
      responses:
        '200':
          $ref: '#/components/responses/DriftResolution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/spaces/{space}/gates:
    parameters:
      - $ref: '#/components/parameters/SpacePath'
    get:
      operationId: listGates
      tags: [gates]
      summary: List decision gates
      description: |
        The space's decision gates, newest first. Without `status`, every
        status is listed. `waiting` are the ones an agent is waiting on (a
        waiting gate past its `expires_at` is `expired`).
      parameters:
        - name: status
          in: query
          description: Only these statuses. Repeat for more than one.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/GateStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of gates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatePageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: requestDecision
      tags: [gates]
      summary: Ask a person to decide
      description: |
        An agent asks a question with two to four options, and the gate waits
        for a person's answer. Only an agent connected to the space at
        Propose or Write asks (an API key may: it proposes); a read-only or
        paused one only reads, and a person remembers the decision instead
        (403 `refused`). One agent has at most three decisions waiting in a
        space (`gate_limit`). A question, its context or an option that
        contains a credential is refused.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestDecisionRequest'
      responses:
        '201':
          description: The gate is waiting.
          headers:
            ETag:
              $ref: '#/components/headers/VersionETag'
            Location:
              $ref: '#/components/headers/GateLocation'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/gates/{ref}:
    parameters:
      - $ref: '#/components/parameters/GateRefPath'
      - $ref: '#/components/parameters/SpaceContext'
    get:
      operationId: getGate
      tags: [gates]
      summary: Read one decision gate
      description: The question, its options, and how it ended, if it has.
      responses:
        '200':
          description: The gate.
          headers:
            ETag:
              $ref: '#/components/headers/VersionETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/gates/{ref}:answer:
    parameters:
      - $ref: '#/components/parameters/GateRefPath'
      - $ref: '#/components/parameters/SpaceContext'
    post:
      operationId: answerGate
      tags: [gates]
      summary: Answer a decision gate
      description: |
        A person answers with one of the gate's options, and the answer is
        kept, in the same command, as a decision they authored: `memory` in
        the result, with a `kept` receipt, beside the gate's `answered`
        receipt. It follows Keep's rules for a decision: only members and
        owners (per the space's rules) answer, never an agent or an API key,
        and where the space's decisions need a person on the web
        (`gate.needs_web`) only a request from the web app answers; anything
        else is refused (`decision_needs_web`) and the gate keeps waiting. A
        gate answered, withdrawn or expired already is 409
        `invalid_transition`, with `details.status`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchGate'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerGateRequest'
      responses:
        '200':
          $ref: '#/components/responses/GateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '412':
          $ref: '#/components/responses/EditClash'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/gates/{ref}:withdraw:
    parameters:
      - $ref: '#/components/parameters/GateRefPath'
      - $ref: '#/components/parameters/SpaceContext'
    post:
      operationId: withdrawGate
      tags: [gates]
      summary: Withdraw a decision gate
      description: |
        Takes a waiting gate's question back. The agent that asked may (and
        then it knows already), and so may the person it works for and
        anyone who could answer it (`not_your_gate` otherwise). A gate that
        isn't waiting is 409 `invalid_transition`, with `details.status`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchGate'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          $ref: '#/components/responses/GateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '412':
          $ref: '#/components/responses/EditClash'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/device-authorizations:lookup:
    post:
      operationId: lookupDeviceAuthorization
      tags: [devices]
      summary: Read a device's sign-in code
      x-memax-read: true
      description: |
        What a waiting device code says about the device asking (CliAuth):
        the client and its version, the machine's name and system, the
        space it will use, and the address its request came from. All of
        it but the address is what the device says about itself. A code
        you decided reads as it ended; anyone else's is 404, as a code that
        doesn't exist is, and naming codes that don't exist too often is
        429 `rate_limited`. It is a `POST` so the code stays out of URLs
        and access logs, and it takes no `Idempotency-Key`. Only a person
        on a session reads one (`device_by_person`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCodeRequest'
      responses:
        '200':
          description: The code and the device asking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorizationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/device-authorizations:approve:
    post:
      operationId: approveDeviceAuthorization
      tags: [devices]
      summary: Sign a device in
      description: |
        Confirms a waiting code: the device's next poll of the token
        endpoint collects a session for you, once. The session is the
        CLI's (`surface` cli), so what the device does with it is
        `client_attested`, never `human_web`. Only a person on the web app
        confirms a code (`device_needs_web` otherwise; `device_by_person`
        for agents and keys), so an agent holding your CLI login can't sign
        more machines in. Confirming a code you already confirmed answers
        it as it is; a code you declined or that expired is 409
        `invalid_transition` with `details.state`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCodeRequest'
      responses:
        '200':
          description: The code, confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorizationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/device-authorizations:deny:
    post:
      operationId: denyDeviceAuthorization
      tags: [devices]
      summary: Decline a device's code
      description: |
        Declines a waiting code ("It doesn't match"): the device hears
        `access_denied` and nothing is signed in. The same rules as
        confirming apply: a person on the web app, once; a code you
        confirmed, or that expired, is 409 `invalid_transition`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCodeRequest'
      responses:
        '200':
          description: The code, declined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorizationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        A signed-in session token, an OAuth access token, or an API key
        (`mxk_…`). A session acts as the person. An API key or an OAuth
        grant acts as the agent connection it is bound to, at that
        connection's autonomy in each space (Read when the credential has no
        write access; an API key proposes at most). A credential with no
        connection, or a paused one, only reads.

  parameters:
    SpacePath:
      name: space
      in: path
      required: true
      description: The space's id or slug.
      schema:
        $ref: '#/components/schemas/SpaceKey'
    SpaceContext:
      name: space
      in: query
      description: |
        The space a display ID belongs to, by id or slug. Required with a
        display ID; optional with a memory id, where it must match.
      schema:
        $ref: '#/components/schemas/SpaceKey'
    RefPath:
      name: ref
      in: path
      required: true
      description: A display ID (M-0219, with `?space=`) or a memory id.
      schema:
        $ref: '#/components/schemas/MemoryRef'
    AgentPath:
      name: agent
      in: path
      required: true
      description: The agent connection's id.
      schema:
        $ref: '#/components/schemas/Id'
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Limit:
      name: limit
      in: query
      description: Page size. Larger values are capped at 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A key you choose for this command, such as a uuid. Send the same key
        when you retry; send a new key for a new command.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `ETag` (memory version) you started from, e.g. `"3"`.
      schema:
        $ref: '#/components/schemas/VersionTag'
    IfMatchOptional:
      name: If-Match
      in: header
      description: The `ETag` (memory version) you reviewed, e.g. `"3"`.
      schema:
        $ref: '#/components/schemas/VersionTag'
    Via:
      name: X-Memax-Via
      in: header
      description: |
        The surface the command came through, for its receipt. Defaults to
        `api`. Every value here records a client-attested change; Memax
        records a change as made by a person on the web (`via: web`) only
        when the web app's proxy signed the request for a session issued to
        the web app.
      schema:
        type: string
        enum: [api, cli, mcp]

    ReceiptPath:
      name: receipt
      in: path
      required: true
      description: A receipt's id.
      schema:
        $ref: '#/components/schemas/Id'

    ImportPath:
      name: import
      in: path
      required: true
      description: The import's id.
      schema:
        $ref: '#/components/schemas/Id'
    ConflictNumber:
      name: n
      in: path
      required: true
      description: The disagreement's number within the import (its `n`, from 1).
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,4}$'

    GateRefPath:
      name: ref
      in: path
      required: true
      description: A gate's display ID (G-0012, with `?space=`) or its id.
      schema:
        $ref: '#/components/schemas/GateRef'
    IfMatchGate:
      name: If-Match
      in: header
      description: |
        The gate's `ETag` (its version) you read, e.g. `"1"`. A gate's
        version changes only when it ends: one that ended since is 409
        `invalid_transition` (with `details.status`), and a version that
        isn't the waiting gate's is 412 `edit_clash`.
      schema:
        $ref: '#/components/schemas/VersionTag'

    TargetPath:
      name: target
      in: path
      required: true
      description: The target's id.
      schema:
        $ref: '#/components/schemas/Id'
    IfMatchVersion:
      name: If-Match
      in: header
      description: |
        The `ETag` (the Brief's or the target's version) you started from,
        e.g. `"3"`. Revising a Brief requires it once the space has one.
      schema:
        $ref: '#/components/schemas/VersionTag'

  headers:
    ETag:
      description: The memory's version, quoted. Send it back as `If-Match`.
      required: true
      schema:
        $ref: '#/components/schemas/VersionTag'
    Location:
      description: The memory's URL, by id.
      required: true
      schema:
        type: string
        format: uri-reference
    IdempotentReplayed:
      description: Set to `true` when the Idempotency-Key was already applied and nothing new was written.
      schema:
        type: string
        enum: ['true']
    RetryAfter:
      description: Seconds to wait before retrying.
      required: true
      schema:
        type: string
        pattern: '^[0-9]+$'

    VersionETag:
      description: The object's version, quoted. Send it back as `If-Match`.
      required: true
      schema:
        $ref: '#/components/schemas/VersionTag'
    TargetLocation:
      description: The target's URL, by id.
      required: true
      schema:
        type: string
        format: uri-reference
    GateLocation:
      description: The gate's URL, by id.
      required: true
      schema:
        type: string
        format: uri-reference
    ImportURL:
      description: The import's URL.
      required: true
      schema:
        type: string
        format: uri-reference

  responses:
    CommandResult:
      description: The command was applied, or sent to Review.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandResultEnvelope'
    MemoriesCommandResult:
      description: The command was applied; `memories` are every memory it changed.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MemoriesCommandResultEnvelope'
    UndoRefused:
      description: '`undo_refused`: see `details.reason`, and `details.ref` for what is in the way.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AgentCommandResult:
      description: The change to the agent was applied (or there was nothing to change).
      headers:
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentCommandResultEnvelope'
    BadRequest:
      description: |
        `invalid_request`, `idempotency_key_required`, `space_required` or
        `ambiguous_ref`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: '`unauthorized`: sign in again or check the API key.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: |
        `refused` (policy; see `details.policy`), `permission_denied`,
        `impersonation_read_only` or `surface_unverified`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: '`not_found`: no such space or memory in your spaces.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidTransition:
      description: "`invalid_transition`: the memory's, agent's or gate's state doesn't allow this command (keeping a kept memory, pausing a paused agent, anything on a disconnected one, answering a gate that was answered, withdrawn or expired). `in_conflict` (Keep, and edit then keep): the judge flagged the proposal as contradicting a decision in force; `details.ref` is that decision, and the conflict is settled with `:resolve-conflict`. On `:resolve-conflict`, `in_conflict` names a decision in force that is in the way of the answer: another conflict of the side it would keep, or one the judge found narrower words contradict."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    EditClash:
      description: '`edit_clash`: the memory changed since you read it. Reload and try again.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    IdempotencyKeyReused:
      description: '`idempotency_key_reused`: send a new key for a new command.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionRequired:
      description: '`precondition_required`: send `If-Match` with the version you started from.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: '`rate_limited`: wait for `Retry-After` seconds.'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: '`internal_error`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: |
        `busy` (another change holds the memory; `Retry-After` is set),
        `judge_pending` (Keep: the judge hasn't looked at these words yet,
        on a proposal that touches a decision in force; `Retry-After` is set
        and `details.ref` names the memory; the same Keep goes through once
        it has, or after at most 30 s) or `unavailable` (the record is not
        configured on this server).
      headers:
        Retry-After:
          description: Seconds to wait before retrying; set for `busy` and `judge_pending`.
          schema:
            type: string
            pattern: '^[0-9]+$'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    SpaceConflict:
      description: '`slug_taken` (the slug belongs to another space) or `space_has_notes` (the space holds V1 memories, `details.notes`; switch it in the app).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    TargetResult:
      description: The target after the command.
      headers:
        ETag:
          $ref: '#/components/headers/VersionETag'
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TargetResultEnvelope'
    CompileLoadRecorded:
      description: The load, recorded as a read (or already recorded under this key).
      headers:
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CompileLoadResultEnvelope'
    GateResult:
      description: The gate after the command (and, for an answer, the decision it became).
      headers:
        ETag:
          $ref: '#/components/headers/VersionETag'
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GateResultEnvelope'
    DriftResolution:
      description: The hand edits, resolved.
      headers:
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DriftResolutionEnvelope'

  schemas:
    # ------------------------------------------------------------------
    # Scalars
    # ------------------------------------------------------------------
    Id:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    SpaceKey:
      description: A space's id or slug.
      type: string
      minLength: 1
      maxLength: 255
    MemoryRef:
      description: A display ID (M-0219) or a memory id.
      type: string
      pattern: '^(?:[Mm]-[0-9]{1,18}|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
    DisplayRef:
      description: A memory's display ID, unique within its tenant.
      type: string
      pattern: '^M-[0-9]{4,18}$'
    VersionTag:
      description: A memory version as an entity tag, `"3"`. A bare `3` is accepted too.
      type: string
      pattern: '^(?:"[0-9]{1,9}"|[0-9]{1,9})$'
    Cursor:
      description: Opaque. Pass it back as `cursor`.
      type: string
    Reason:
      description: Why. It goes into the receipt, and is redacted if the memory is forgotten.
      type: string
      maxLength: 2000
    SessionRef:
      description: The agent session the command came from, if any.
      type: string
      maxLength: 255
    Section:
      description: Where a memory sits in the Brief.
      type: string
      enum: [decisions, conventions, preferences, open_question]
    MemoryKind:
      type: string
      enum: [fact, decision]
    State:
      description: |
        The one state people see, derived from `lifecycle` and `flags`:
        forgotten > conflict > stale > proposed > merged > faded > kept.
        `rejected` is internal and carries no mark.
      type: string
      enum: [proposed, kept, merged, stale, conflict, faded, forgotten, rejected]
    Lifecycle:
      type: string
      enum: [proposed, kept, merged, faded, forgotten, rejected]
    Flag:
      type: string
      enum: [conflict, stale]
    Trust:
      description: |
        The class of a source, and of a memory (the lowest of its sources),
        highest first. `external` is quarantined.
      type: string
      enum: [person, agent_own_work, repository, external]
    SourceKind:
      description: |
        What a source points at. `memory` cites a kept memory in the same
        space by its display ID (a kept Ask answer cites the memories it
        came from); its trust is the cited memory's, whatever the request
        says.
      type: string
      enum: [session, pr, file, url, issue, email, note, import, memory]
    SpaceKind:
      type: string
      enum: [personal, project, team]
    Role:
      type: string
      enum: [owner, member, viewer]
    Autonomy:
      description: |
        What an agent may do in a space. `read` writes nothing; `propose`
        sends its writes to Review; `write` keeps them, still with a
        receipt (and still proposes what cites an outside source).
      type: string
      enum: [read, propose, write]
    AgentKind:
      description: Which agent a connection is. `other` is any agent Memax doesn't know by name.
      type: string
      enum: [claude-code, codex, cursor, chatgpt, claude, gemini-cli, copilot, opencode, windsurf, other]
    AgentSurface:
      description: Where the agent runs.
      type: string
      enum: [cli, ide, cloud, chat]
    AgentState:
      description: |
        `active`; `paused` (it only reads until resumed); `disconnected`
        (for good, its credential revoked).
      type: string
      enum: [active, paused, disconnected]
    CredentialKind:
      type: string
      enum: [api_key, oauth_grant]
    ActorKind:
      type: string
      enum: [person, agent, dream, memax, repository]
    Via:
      description: The surface a change came through.
      type: string
      enum: [web, cli, mcp, review, api, email, slack, github, linear, import, system]
    Assurance:
      description: |
        For keeps, and a person's changes to an agent connection:
        `human_web` when Memax verified the person was on the web app,
        `client_attested` when a client (the CLI, an agent) says a person did.
      type: string
      enum: [human_web, client_attested]
    ReceiptAction:
      description: |
        The past-tense verb a receipt records. An agent connection's
        receipts (`object_kind: agent`) are connected, autonomy_changed,
        paused, resumed and disconnected. A Brief's (`brief`) are revised; a
        target's (`target`) configured, requested, observed, pulled,
        overwritten and stopped; a compile run's (`compile`) compiled and
        delivered. The judge's (by Memax) are merged (a fold), linked (an
        update or explicit change), flagged (a conflict), returned (a
        Write-level agent's write it found contradicting a decision in
        force, put back in Review as a conflict; `source` is that decision)
        and judged (nothing to do); settling a conflict writes resolved,
        kept, rejected, edited, superseded or faded, and drafted (narrower
        words for a kept memory, held out of force until the judge has seen
        them); Undo writes undid. A decision gate's (`gate`) are asked (by
        the agent), answered (by a person; the kept decision it became has
        its own `kept` receipt) and withdrawn.
      type: string
      enum:
        - proposed
        - kept
        - edited
        - rejected
        - merged
        - flagged
        - resolved
        - verified
        - faded
        - restored
        - forgot
        - moved
        - compiled
        - handed_off
        - answered
        - undid
        - connected
        - autonomy_changed
        - paused
        - resumed
        - disconnected
        - revised
        - configured
        - requested
        - delivered
        - observed
        - pulled
        - overwritten
        - stopped
        - judged
        - linked
        - superseded
        - asked
        - withdrawn
        - returned
        - drafted
    ObjectKind:
      type: string
      enum: [memory, note, brief, target, compile, handoff, gate, dream, agent, space]
    Outcome:
      description: |
        What a command did. `applied`: it took effect as asked. `proposed`:
        it went to Review. `needs_confirmation`: it went to Review, and the
        agent should ask the person to keep it.
      type: string
      enum: [applied, proposed, needs_confirmation]
    PolicyEffect:
      type: string
      enum: [apply, propose, confirm, refuse]
    PolicyCode:
      description: |
        Why policy decided what it did. Stable; clients localise by it.
        Refusals: unknown_actor, unknown_action, secret_detected, not_member,
        read_only, key_read_only, key_cannot_review, key_cannot_forget,
        person_must_review, person_must_forget, forget_not_allowed,
        external_needs_review, proposal_in_review, agent_not_connected (the
        agent has no connection, or none to this space, so it only reads),
        agent_paused, brief_by_person (agents propose; people edit the
        Brief), targets_by_person, compile_by_memax, judge_by_memax,
        undo_by_decider (only the person who decided can undo it). Refused
        decision gates: gate_by_agent (agents ask; people decide directly),
        person_must_answer (agents ask; people answer), gate_limit (the agent
        already has 3 decisions waiting in the space), not_your_gate (only the
        agent that asked, the person it works for, or someone who can answer
        withdraws a question). Refused asks: ask_by_person (agents read over
        MCP; Ask answers people), ask_limit (the plan's asks this month are
        used up; `details.limit` and `details.resets_at` say how many and
        when they start again). Refused changes to
        agents: person_must_manage (only a person changes what an agent may
        do), not_your_agent, autonomy_not_allowed, key_max_propose,
        autonomy_needs_web (raising an agent needs a person on the web).
        Refused or sent to Review:
        viewer, owners_keep, decision_needs_web. Sent to Review: api_key,
        external_source, contradicts_decision, touches_decision (a
        Write-level agent's write that touches a decision in force waits for
        the judge and a person), edits_person_kept,
        autonomy_propose, integration, import, system_proposes, repository,
        person_proposed. Saved, not kept: judge_pending (a person's edit,
        then keep, whose new words touch a decision in force: the edit is
        the proposal's new version, and Keep waits for the judge; and a
        "keep both" whose narrower words touch another decision in force:
        they are saved, and the same resolution waits for the judge).
        Confirmation: confirm_in_agent.
        Refused changes to spaces: space_by_person (only a signed-in person
        creates or switches a space), space_kind (only project spaces are
        created here), space_limit (the most project spaces one person owns
        during the alpha), switch_by_owner (only the owner switches a space).
        Refused device codes: device_by_person (only a person signs a device
        in), device_needs_web (confirming or declining a code needs a person
        on the web app).
      type: string
      enum:
        - unknown_actor
        - unknown_action
        - secret_detected
        - not_member
        - read_only
        - key_read_only
        - key_cannot_review
        - key_cannot_forget
        - person_must_review
        - person_must_forget
        - forget_not_allowed
        - external_needs_review
        - proposal_in_review
        - agent_not_connected
        - agent_paused
        - person_must_manage
        - not_your_agent
        - autonomy_not_allowed
        - key_max_propose
        - autonomy_needs_web
        - brief_by_person
        - targets_by_person
        - compile_by_memax
        - judge_by_memax
        - undo_by_decider
        - gate_by_agent
        - person_must_answer
        - gate_limit
        - not_your_gate
        - ask_by_person
        - ask_limit
        - viewer
        - owners_keep
        - decision_needs_web
        - api_key
        - external_source
        - contradicts_decision
        - touches_decision
        - edits_person_kept
        - autonomy_propose
        - integration
        - import
        - system_proposes
        - repository
        - person_proposed
        - judge_pending
        - confirm_in_agent
        - space_by_person
        - space_kind
        - space_limit
        - switch_by_owner
        - device_by_person
        - device_needs_web
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - idempotency_key_required
        - space_required
        - ambiguous_ref
        - unauthorized
        - refused
        - permission_denied
        - impersonation_read_only
        - surface_unverified
        - not_found
        - method_not_allowed
        - invalid_transition
        - in_conflict
        - undo_refused
        - edit_clash
        - idempotency_key_reused
        - precondition_required
        - rate_limited
        - internal_error
        - busy
        - judge_pending
        - unavailable
        - slug_taken
        - space_has_notes

    LinkKind:
      description: |
        A typed edge between two memories. merged_into: folded into another
        memory (a duplicate, or a repeat of a rejection). supersedes: replaces
        (or, as a proposal, would replace) another. conflicts_with:
        contradicts a decision in force. closes: settles another.
      type: string
      enum: [merged_into, supersedes, conflicts_with, closes]
    LinkDirection:
      description: '`out`: from this memory to the other; `in`: from the other to this one.'
      type: string
      enum: [out, in]
    Relation:
      description: How the judge found a memory relates to another; `none` when it compared nothing.
      type: string
      enum: [duplicate, updates, extends, contradicts, unrelated, none]
    JudgeStage:
      description: |
        What decided the verdict: `exact` (the same words), `near` (a
        near-verbatim repeat), `reproposal` (a repeat of a rejection),
        `llm` (the model), `none` (nothing to compare, or no model).
      type: string
      enum: [exact, near, reproposal, llm, none]
    VerdictOutcome:
      description: |
        What the verdict did: folded, suppressed (folded into a rejection),
        linked (an update), superseding (an explicit change of a decision in
        force, which keeping it supersedes), flagged (a conflict), none,
        failed (no usable answer from the model; nothing flagged) or skipped
        (what it pointed at changed first).
      type: string
      enum: [folded, suppressed, linked, superseding, flagged, none, failed, skipped]
    JudgeState:
      description: '`working`: not judged yet (Review''s neutral mark). `judged`. `failed`: reviewed as usual.'
      type: string
      enum: [working, judged, failed]
    ModelTier:
      description: The judge's model tier whose answer counted.
      type: string
      enum: [primary, fallback, strong]
    ConflictChoice:
      description: ReviewConflict's answers, relative to the memory in the path.
      type: string
      enum: [keep_this, keep_other, keep_both, leave_open]
    ConflictChange:
      description: What an answer does to one side.
      type: string
      enum: [kept, rejected, superseded, faded, open, stays]
    UndoRefusal:
      description: Why an undo was refused.
      type: string
      enum: [window_passed, later_changes, already_undone, not_undoable]

    GateRef:
      description: A decision gate's display ID (G-0012) or its id.
      type: string
      pattern: '^(?:[Gg]-[0-9]{1,18}|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
    GateDisplayRef:
      description: A decision gate's display ID, unique within its tenant.
      type: string
      pattern: '^G-[0-9]{4,18}$'
    GateStatus:
      description: |
        `waiting` for a person; `answered` (kept as a decision); `withdrawn`
        (the question was taken back); `expired` (it waited past
        `expires_at`, and can't be answered).
      type: string
      enum: [waiting, answered, withdrawn, expired]

    BriefRef:
      description: A Brief version's display ID, unique within its tenant.
      type: string
      pattern: '^B-[0-9]{4,18}$'
    CompileRef:
      description: A compile run's display ID, unique within its tenant.
      type: string
      pattern: '^C-[0-9]{4,18}$'
    MemoryDisplayRef:
      description: A memory's display ID; any case and padding (`m-219` is M-0219).
      type: string
      pattern: '^[Mm]-[0-9]{1,18}$'
    SectionKey:
      description: 'The compiler''s section key: decisions, conventions, preferences, open, overview, or your own.'
      type: string
      pattern: '^[a-z][a-z0-9_-]{0,39}$'
    RepoPath:
      description: A path relative to the repository root, with no `..` and no leading `/`.
      type: string
      minLength: 1
      maxLength: 300
      pattern: '^[A-Za-z0-9._/-]+$'
    Sha256:
      description: A lowercase hex sha256.
      type: string
      pattern: '^[0-9a-f]{64}$'
    TargetKind:
      description: |
        The compiler's adapter. agents_md is the canonical AGENTS.md;
        claude_md and gemini_md are shims that import it; cursor_mdc,
        copilot, windsurf and claude_rules hold path-scoped facts only;
        chatgpt is copied out.
      type: string
      enum: [agents_md, claude_md, cursor_mdc, chatgpt, gemini_md, copilot, windsurf, claude_rules]
    Delivery:
      description: |
        How the output reaches its readers: `local` (the daemon writes it),
        `pr` (a pull request), `mcp` (agents read it over MCP) or `copy` (a
        person copies it out; ChatGPT only).
      type: string
      enum: [local, pr, mcp, copy]
    SyncState:
      description: |
        `compiling`: a change hasn't compiled yet. `pending_delivery`: the
        latest compile isn't on disk yet. `in_sync`: it is (or, for MCP and
        copy-out, it compiled). `drifted`: a file was edited by hand.
        `held`: a hand edit came back by a pull, and its proposals wait in
        Review; the file stays as it is until they are kept or rejected.
        `off`: compiling is stopped.
      type: string
      enum: [in_sync, compiling, pending_delivery, drifted, held, off]
    IncludeMode:
      type: string
      enum: [kept_only, kept_and_open]
    StaleMode:
      type: string
      enum: [mark, omit]
    ScopedMode:
      type: string
      enum: [inline, omit]
    CompileStatus:
      type: string
      enum: [compiled, delivered, failed]
    ObservationStatus:
      type: string
      enum: [open, pulled, overwritten, stopped, dismissed]
    ObserverKind:
      type: string
      enum: [device, github]
    DriftMode:
      type: string
      enum: [pull, overwrite, stop]
    ChangeKind:
      type: string
      enum: [edit, new, remove]
    ChangeOutcome:
      description: |
        `proposed`: a proposal was written. `review`: a removed line waits
        for a person to forget or exclude its memory. `skipped`: nothing
        was written (`reason` says why).
      type: string
      enum: [proposed, review, skipped]

    # ------------------------------------------------------------------
    # Objects
    # ------------------------------------------------------------------
    Space:
      type: object
      additionalProperties: false
      required: [id, tenant_id, slug, name, kind, role]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        tenant_id:
          description: Who owns the space's record. Display IDs are unique per tenant.
          $ref: '#/components/schemas/Id'
        slug:
          type: string
        name:
          type: string
        kind:
          $ref: '#/components/schemas/SpaceKind'
        role:
          $ref: '#/components/schemas/Role'
        repository:
          description: The repository the space compiles for, if any.
          type: string
        v2_enabled_at:
          description: >-
            When the space switched to the V2 record. Absent while it is on
            V1: there, agents' writes go to the V1 memory API, and V1
            behaviour applies to every surface.
          type: string
          format: date-time

    DecisionOption:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 500
        detail:
          type: string
          maxLength: 2000

    Decision:
      description: The extra fields of a memory of kind `decision`.
      type: object
      additionalProperties: false
      properties:
        why:
          type: string
          maxLength: 2000
        options:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/DecisionOption'
        consequences:
          type: string
          maxLength: 2000
        area:
          type: string
          maxLength: 500
        status:
          type: string
          enum: [in_force, superseded, open]

    Source:
      description: Where a memory came from.
      type: object
      additionalProperties: false
      required: [id, kind, ref, locator, external, trust, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          $ref: '#/components/schemas/SourceKind'
        ref:
          description: What people see, e.g. "PR #212" or "go.mod:14".
          type: string
        uri:
          description: The machine locator, e.g. a URL or a repository path.
          type: string
        locator:
          description: Structured position data, e.g. {path, line, commit}.
          type: object
          additionalProperties: true
        external:
          description: Third-party content, quarantined to Review.
          type: boolean
        trust:
          $ref: '#/components/schemas/Trust'
        quote:
          description: The supporting excerpt. Purged when the memory is forgotten.
          type: string
        content_hash:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'

    Memory:
      description: One statement and its state.
      type: object
      additionalProperties: false
      required:
        - id
        - ref
        - space_id
        - tenant_id
        - statement
        - section
        - kind
        - state
        - lifecycle
        - flags
        - trust
        - version
        - conditions
        - scope
        - created_receipt_id
        - last_receipt_id
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        ref:
          $ref: '#/components/schemas/DisplayRef'
        space_id:
          $ref: '#/components/schemas/Id'
        tenant_id:
          $ref: '#/components/schemas/Id'
        statement:
          description: The current version's words. Empty once forgotten.
          type: string
          maxLength: 2000
        section:
          $ref: '#/components/schemas/Section'
        kind:
          $ref: '#/components/schemas/MemoryKind'
        state:
          $ref: '#/components/schemas/State'
        lifecycle:
          $ref: '#/components/schemas/Lifecycle'
        flags:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Flag'
        trust:
          $ref: '#/components/schemas/Trust'
        version:
          description: The statement's version; also the `ETag`.
          type: integer
          minimum: 1
        stale_after:
          $ref: '#/components/schemas/Timestamp'
        conditions:
          description: '"Stays true while" conditions.'
          type: array
          items: true
        decision:
          $ref: '#/components/schemas/Decision'
        scope:
          description: 'Where it applies, e.g. {"paths": ["packages/web/**"]}.'
          type: object
          additionalProperties: true
        valid_from:
          $ref: '#/components/schemas/Timestamp'
        valid_to:
          $ref: '#/components/schemas/Timestamp'
        created_receipt_id:
          $ref: '#/components/schemas/Id'
        last_receipt_id:
          $ref: '#/components/schemas/Id'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        sources:
          description: Present when one memory is read and it cites sources.
          type: array
          items:
            $ref: '#/components/schemas/Source'
        links:
          description: Its active links, both ways. Absent when it has none.
          type: array
          items:
            $ref: '#/components/schemas/Link'
        updates:
          description: |
            The memory this one would replace (it has a `supersedes` link to
            it), with its current words, so Review can show the pair as a
            diff ("Updates M-0156").
          $ref: '#/components/schemas/LinkedMemory'
        judge:
          description: |
            The judge's verdict on the current version; for a proposal not
            judged yet, `state: working`. Absent for memories the judge
            doesn't look at (a person's own keep).
          $ref: '#/components/schemas/JudgeInfo'

    Link:
      description: An active link, seen from one memory.
      type: object
      additionalProperties: false
      required: [id, kind, direction, memory_id, ref, receipt_id, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          $ref: '#/components/schemas/LinkKind'
        direction:
          $ref: '#/components/schemas/LinkDirection'
        memory_id:
          description: The other memory.
          $ref: '#/components/schemas/Id'
        ref:
          $ref: '#/components/schemas/DisplayRef'
        receipt_id:
          description: The receipt that made the link.
          $ref: '#/components/schemas/Id'
        created_at:
          $ref: '#/components/schemas/Timestamp'

    LinkedMemory:
      description: The other side of a link, with its current words.
      type: object
      additionalProperties: false
      required: [id, ref, version, statement, lifecycle]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        ref:
          $ref: '#/components/schemas/DisplayRef'
        version:
          type: integer
          minimum: 1
        statement:
          type: string
        lifecycle:
          $ref: '#/components/schemas/Lifecycle'

    MemoryPointer:
      type: object
      additionalProperties: false
      required: [id, ref]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        ref:
          $ref: '#/components/schemas/DisplayRef'

    JudgeInfo:
      description: The judge's verdict on a memory's current version.
      type: object
      additionalProperties: false
      required: [state, version]
      properties:
        state:
          $ref: '#/components/schemas/JudgeState'
        version:
          description: The version judged (or waiting to be).
          type: integer
          minimum: 1
        verdict:
          $ref: '#/components/schemas/Relation'
        outcome:
          $ref: '#/components/schemas/VerdictOutcome'
        stage:
          $ref: '#/components/schemas/JudgeStage'
        related:
          description: The memory the verdict is about.
          $ref: '#/components/schemas/MemoryPointer'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        rationale:
          description: One line from the model, in English. Purged if either memory is forgotten.
          type: string
        merged_statement:
          description: The model's merged wording, for Review to offer.
          type: string
        tier:
          $ref: '#/components/schemas/ModelTier'
        judged_at:
          $ref: '#/components/schemas/Timestamp'

    MemoryVersion:
      description: One version of a memory's statement.
      type: object
      additionalProperties: false
      required: [version, statement, receipt_id, created_at]
      properties:
        version:
          type: integer
          minimum: 1
        statement:
          description: Empty once the memory is forgotten.
          type: string
        receipt_id:
          description: The receipt that wrote this version.
          $ref: '#/components/schemas/Id'
        created_at:
          $ref: '#/components/schemas/Timestamp'

    ReceiptSource:
      description: Where a change came from. A pointer, never a quote.
      type: object
      additionalProperties: false
      required: [kind, ref]
      properties:
        kind:
          type: string
        ref:
          type: string

    Receipt:
      description: One entry of the append-only log. Never holds memory text.
      type: object
      additionalProperties: false
      required:
        - id
        - seq
        - tenant_id
        - space_id
        - object_kind
        - object_id
        - object_ref
        - action
        - actor_kind
        - via
        - occurred_at
        - recorded_at
        - stream_id
        - stream_version
      properties:
        id:
          $ref: '#/components/schemas/Id'
        seq:
          description: Position in the log.
          type: integer
          format: int64
          minimum: 1
        tenant_id:
          $ref: '#/components/schemas/Id'
        space_id:
          $ref: '#/components/schemas/Id'
        object_kind:
          $ref: '#/components/schemas/ObjectKind'
        object_id:
          $ref: '#/components/schemas/Id'
        object_ref:
          type: string
        action:
          $ref: '#/components/schemas/ReceiptAction'
        actor_kind:
          $ref: '#/components/schemas/ActorKind'
        actor_id:
          description: The person, or the agent's credential. Absent for Dream, Memax and the repository.
          $ref: '#/components/schemas/Id'
        agent:
          description: The agent the change came through, e.g. claude-code.
          type: string
        via:
          $ref: '#/components/schemas/Via'
        assurance:
          $ref: '#/components/schemas/Assurance'
        session_ref:
          type: string
        source:
          $ref: '#/components/schemas/ReceiptSource'
        reason:
          description: Why, if given. Redacted when the memory is forgotten.
          type: string
        occurred_at:
          description: When it happened on the client.
          $ref: '#/components/schemas/Timestamp'
        recorded_at:
          description: When the server recorded it.
          $ref: '#/components/schemas/Timestamp'
        stream_id:
          $ref: '#/components/schemas/Id'
        stream_version:
          type: integer
          minimum: 1

    PolicyDecision:
      description: Why a command had the outcome it did.
      type: object
      additionalProperties: false
      required: [effect]
      properties:
        effect:
          $ref: '#/components/schemas/PolicyEffect'
        code:
          $ref: '#/components/schemas/PolicyCode'
        message:
          description: An English sentence; localise by `code`.
          type: string
        quarantine:
          description: External content, held with the ochre notice.
          type: boolean

    CommandResult:
      type: object
      additionalProperties: false
      required: [outcome, policy, memory, receipts]
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        policy:
          $ref: '#/components/schemas/PolicyDecision'
        memory:
          description: |
            The memory's current projection. For an edit sent to Review, the
            new proposal.
          $ref: '#/components/schemas/Memory'
        receipts:
          description: The receipts the command wrote, oldest first.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Receipt'

    MemoriesCommandResult:
      description: A command that changed several memories (settling a conflict, an undo).
      type: object
      additionalProperties: false
      required: [outcome, policy, memory, memories, receipts]
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        policy:
          $ref: '#/components/schemas/PolicyDecision'
        memory:
          description: The memory the command named (for an undo, the first it restored).
          $ref: '#/components/schemas/Memory'
        memories:
          description: Every memory the command changed, that one first.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Memory'
        receipts:
          description: The receipts the command wrote, oldest first.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Receipt'

    ConflictEffect:
      type: object
      additionalProperties: false
      required: [ref, change]
      properties:
        ref:
          $ref: '#/components/schemas/DisplayRef'
        change:
          $ref: '#/components/schemas/ConflictChange'

    ConflictOption:
      type: object
      additionalProperties: false
      required: [choice, effects, allowed]
      properties:
        choice:
          $ref: '#/components/schemas/ConflictChoice'
        effects:
          description: What it does to each side, this memory first.
          type: array
          items:
            $ref: '#/components/schemas/ConflictEffect'
        allowed:
          description: Whether you may take it.
          type: boolean
        policy:
          description: Why you may not, when policy says so.
          $ref: '#/components/schemas/PolicyDecision'

    Conflict:
      description: Both sides of a conflict, for ReviewConflict.
      type: object
      additionalProperties: false
      required: [memory, other, flagged_ref, decision_ref, link, receipts, options]
      properties:
        memory:
          description: This side, with its sources, links and verdict.
          $ref: '#/components/schemas/Memory'
        other:
          $ref: '#/components/schemas/Memory'
        flagged_ref:
          description: The side carrying the conflict flag.
          $ref: '#/components/schemas/DisplayRef'
        decision_ref:
          description: The decision in force it contradicts.
          $ref: '#/components/schemas/DisplayRef'
        link:
          description: The conflicts_with link, seen from this side.
          $ref: '#/components/schemas/Link'
        receipts:
          description: Both sides' latest receipts, newest first.
          type: array
          items:
            $ref: '#/components/schemas/Receipt'
        options:
          type: array
          items:
            $ref: '#/components/schemas/ConflictOption'

    MemoryDetail:
      type: object
      additionalProperties: false
      required: [memory, versions, receipts]
      properties:
        memory:
          $ref: '#/components/schemas/Memory'
        versions:
          description: Every version of the statement, newest first.
          type: array
          items:
            $ref: '#/components/schemas/MemoryVersion'
        receipts:
          $ref: '#/components/schemas/ReceiptPage'
        reads:
          description: How agents read it. Absent when the counts couldn't be read.
          $ref: '#/components/schemas/MemoryReads'

    MemoryReads:
      description: |
        How a memory has been read: directly (recall, search, get, list) and
        in every compile that contained it (a session-start digest, a
        reported load), over the last 13 months.
      type: object
      additionalProperties: false
      required: [reads, reads_7d, agents, readers, unobserved_target]
      properties:
        reads:
          description: Reads of it in the last 13 months.
          type: integer
          minimum: 0
        reads_7d:
          description: Reads of it in the last 7 days.
          type: integer
          minimum: 0
        last_read_at:
          description: Its latest read; absent if it was never read.
          $ref: '#/components/schemas/Timestamp'
        agents:
          description: How many agents read it ("reaches 5 agents").
          type: integer
          minimum: 0
        readers:
          description: Who read it, most recent first (at most 20).
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/MemoryReader'
        unobserved_target:
          description: |
            It is in a compiled file whose loads Memax can't see (agents read
            the file natively and no hook reports the loads), so it may be
            read more than counted, and it never fades.
          type: boolean

    MemoryReader:
      description: One reader of a memory.
      type: object
      additionalProperties: false
      required: [reader_kind, person_id, reads, reads_7d, last_read_at]
      properties:
        reader_kind:
          $ref: '#/components/schemas/ReaderKind'
        connection_id:
          description: The agent connection, for an agent.
          $ref: '#/components/schemas/Id'
        person_id:
          description: The person, or the person the agent works for.
          $ref: '#/components/schemas/Id'
        agent:
          $ref: '#/components/schemas/AgentKind'
        display_name:
          description: The agent connection's name, when you can see the connection.
          type: string
        reads:
          type: integer
          minimum: 1
        reads_7d:
          type: integer
          minimum: 0
        last_read_at:
          $ref: '#/components/schemas/Timestamp'

    Checkpoint:
      description: |
        One signed checkpoint of a space's receipt chain. Its signature is
        Ed25519 over the checkpoint statement (receiptchain format 1: the
        magic `memax.checkpoint.v1`, then the length-prefixed space_id,
        tenant_id, number, position_from, position_to, first and last
        receipt ids, last_seq, prev_sha256, chain_sha256, merkle_root,
        sealed_at in microseconds and key_id).
      type: object
      additionalProperties: false
      required:
        - id
        - space_id
        - tenant_id
        - number
        - position_from
        - position_to
        - receipts
        - first_receipt_id
        - last_receipt_id
        - last_seq
        - prev_sha256
        - chain_sha256
        - merkle_root
        - format
        - signed
        - sealed_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        space_id:
          $ref: '#/components/schemas/Id'
        tenant_id:
          $ref: '#/components/schemas/Id'
        number:
          description: 1, 2, 3 … in the space.
          type: integer
          minimum: 1
        position_from:
          description: The first receipt's position in the space's chain, from 1.
          type: integer
          minimum: 1
        position_to:
          type: integer
          minimum: 1
        receipts:
          type: integer
          minimum: 1
        first_receipt_id:
          $ref: '#/components/schemas/Id'
        last_receipt_id:
          $ref: '#/components/schemas/Id'
        last_seq:
          description: The last receipt's `seq`.
          type: integer
          minimum: 1
        prev_sha256:
          description: The chain hash before the range (the space's genesis hash for the first checkpoint).
          $ref: '#/components/schemas/Sha256'
        chain_sha256:
          description: The chain hash after the range.
          $ref: '#/components/schemas/Sha256'
        merkle_root:
          description: The RFC 6962 Merkle root of the range's receipt leaves.
          $ref: '#/components/schemas/Sha256'
        format:
          description: The receipts' canonical encoding version.
          type: integer
          enum: [1]
        signed:
          description: False when the server had no signing key; the checkpoint still chains.
          type: boolean
        key_id:
          description: The signing key, as in `keys`.
          type: string
        signature:
          description: The Ed25519 signature, base64.
          type: string
        sealed_at:
          $ref: '#/components/schemas/Timestamp'
        stored_at:
          description: When its copy reached object storage; absent until then.
          $ref: '#/components/schemas/Timestamp'

    SealStatus:
      description: How far a space's receipt chain is sealed and verified.
      type: object
      additionalProperties: false
      required: [sealed_receipts, checkpoints, unsealed]
      properties:
        sealed_receipts:
          description: Receipts sealed so far.
          type: integer
          minimum: 0
        sealed_through_seq:
          description: The last sealed receipt's `seq`.
          type: integer
          minimum: 1
        sealed_through_receipt_id:
          $ref: '#/components/schemas/Id'
        head_sha256:
          description: The chain hash after the last sealed receipt.
          $ref: '#/components/schemas/Sha256'
        checkpoints:
          type: integer
          minimum: 0
        sealed_at:
          $ref: '#/components/schemas/Timestamp'
        unsealed:
          description: Receipts written but not sealed yet (counted up to 10,000).
          type: integer
          minimum: 0
        verified_at:
          description: When the chain was last verified from its first receipt.
          $ref: '#/components/schemas/Timestamp'
        verified_receipts:
          type: integer
          minimum: 0
        verify_problems:
          description: What the last verification found wrong; 0 means the chain verified.
          type: integer
          minimum: 0

    SigningKey:
      description: A public key checkpoints are signed with.
      type: object
      additionalProperties: false
      required: [key_id, algorithm, public_key]
      properties:
        key_id:
          type: string
        algorithm:
          type: string
          enum: [ed25519]
        public_key:
          description: The raw 32-byte public key, base64.
          type: string

    CheckpointPage:
      type: object
      additionalProperties: false
      required: [items, has_more, seal, keys]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Checkpoint'
        has_more:
          type: boolean
        next_cursor:
          $ref: '#/components/schemas/Cursor'
        seal:
          $ref: '#/components/schemas/SealStatus'
        keys:
          type: array
          items:
            $ref: '#/components/schemas/SigningKey'

    ReaderKind:
      description: '`agent` (an agent connection) or `person` (a person''s CLI reporting their agent''s session start).'
      type: string
      enum: [agent, person]

    ReadKind:
      description: |
        What a read went through: `recall` (with a query), `search`, `get`
        (one memory), `list` (a page of kept memories), `digest` (recall
        without a query, at session start), or `compile_load` (a hook
        reported the compile its agent loaded natively).
      type: string
      enum: [recall, search, get, list, digest, compile_load]

    ReadVia:
      description: The surface a read came through.
      type: string
      enum: [mcp, api, cli]

    ReadRef:
      description: A read's display ID, unique within its tenant.
      type: string
      pattern: '^R-[0-9]{4,18}$'

    Read:
      description: One read of one space (R-). It never holds memory text or the query.
      type: object
      additionalProperties: false
      required: [id, ref, space_id, reader_kind, person_id, kind, via, memories, memory_refs, read_at, recorded_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        ref:
          $ref: '#/components/schemas/ReadRef'
        space_id:
          $ref: '#/components/schemas/Id'
        reader_kind:
          $ref: '#/components/schemas/ReaderKind'
        connection_id:
          description: The agent connection, for an agent.
          $ref: '#/components/schemas/Id'
        person_id:
          description: The person, or the person the agent works for.
          $ref: '#/components/schemas/Id'
        agent:
          $ref: '#/components/schemas/AgentKind'
        kind:
          $ref: '#/components/schemas/ReadKind'
        via:
          $ref: '#/components/schemas/ReadVia'
        session_ref:
          $ref: '#/components/schemas/SessionRef'
        compile:
          description: The compile run read, for a compiled digest or a compile load.
          $ref: '#/components/schemas/CompileRef'
        memories:
          description: How many memories it covered; for a compile, every fact in it.
          type: integer
          minimum: 0
        memory_refs:
          description: The memories it returned directly, in display order (at most 200).
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/DisplayRef'
        read_at:
          $ref: '#/components/schemas/Timestamp'
        recorded_at:
          $ref: '#/components/schemas/Timestamp'

    ReadPage:
      type: object
      additionalProperties: false
      required: [items, has_more, reads_7d]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Read'
        has_more:
          type: boolean
        next_cursor:
          $ref: '#/components/schemas/Cursor'
        reads_7d:
          description: The space's reads in the last 7 days.
          type: integer
          minimum: 0

    CompileLoadRequest:
      type: object
      additionalProperties: false
      required: [compile]
      properties:
        compile:
          description: The compile run the agent loaded, by display ID (C-0012) or id, from the compiled file's header.
          type: string
          pattern: '^(?:[Cc]-[0-9]{1,18}|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
        agent:
          description: The agent whose session loaded it. Ignored for an agent's own credential, which is always its agent.
          $ref: '#/components/schemas/AgentKind'
        session_ref:
          $ref: '#/components/schemas/SessionRef'
        loaded_at:
          description: When the session loaded it; defaults to now, and must be within the last day.
          $ref: '#/components/schemas/Timestamp'

    CompileLoadResult:
      type: object
      additionalProperties: false
      required: [read]
      properties:
        read:
          $ref: '#/components/schemas/Read'

    SpaceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Space'

    MemoryPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Memory'
        has_more:
          type: boolean
        next_cursor:
          $ref: '#/components/schemas/Cursor'

    ReviewPage:
      type: object
      additionalProperties: false
      required: [items, has_more, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Memory'
        has_more:
          type: boolean
        next_cursor:
          $ref: '#/components/schemas/Cursor'
        total:
          description: How many memories are waiting, across every page.
          type: integer
          minimum: 0

    ReceiptPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Receipt'
        has_more:
          type: boolean
        next_cursor:
          $ref: '#/components/schemas/Cursor'

    AgentCredential:
      description: The credential a connection is bound to.
      type: object
      additionalProperties: false
      required: [kind, id, active]
      properties:
        kind:
          $ref: '#/components/schemas/CredentialKind'
        id:
          description: The API key's or OAuth grant's id.
          $ref: '#/components/schemas/Id'
        active:
          description: False once the credential is revoked, expired or deleted.
          type: boolean

    AgentSpace:
      description: A connection's autonomy in one space, and its use there.
      type: object
      additionalProperties: false
      required: [space_id, slug, name, kind, autonomy, reads_7d, writes_7d, updated_at]
      properties:
        space_id:
          $ref: '#/components/schemas/Id'
        slug:
          type: string
        name:
          type: string
        kind:
          $ref: '#/components/schemas/SpaceKind'
        autonomy:
          $ref: '#/components/schemas/Autonomy'
        reads_7d:
          description: Its reads (R-) of this space in the last 7 days.
          type: integer
          minimum: 0
        writes_7d:
          description: Memories it proposed, kept or edited in the last 7 days.
          type: integer
          minimum: 0
        updated_at:
          description: When its autonomy here last changed.
          $ref: '#/components/schemas/Timestamp'

    AgentConnection:
      description: |
        An agent working for a person through one credential: the identity
        its receipts name, and its autonomy in each space.
      type: object
      additionalProperties: false
      required:
        - id
        - person_id
        - agent
        - display_name
        - surface
        - credential
        - max_autonomy
        - state
        - spaces
        - reads_7d
        - writes_7d
        - created_receipt_id
        - last_receipt_id
        - created_at
        - updated_at
      properties:
        id:
          description: The connection's id; receipts of its writes carry it as `actor_id`.
          $ref: '#/components/schemas/Id'
        person_id:
          description: The person it works for.
          $ref: '#/components/schemas/Id'
        agent:
          $ref: '#/components/schemas/AgentKind'
        display_name:
          type: string
        surface:
          $ref: '#/components/schemas/AgentSurface'
        credential:
          $ref: '#/components/schemas/AgentCredential'
        max_autonomy:
          description: |
            The most its credential allows: an API key proposes at most, and
            a credential without write access (or one no longer active) only
            reads.
          $ref: '#/components/schemas/Autonomy'
        client_id:
          description: The OAuth client's Client ID Metadata Document URL, when it has one.
          type: string
        state:
          $ref: '#/components/schemas/AgentState'
        spaces:
          description: |
            The spaces of yours it is connected to, personal space first. In a
            space it isn't connected to, it only reads.
          type: array
          items:
            $ref: '#/components/schemas/AgentSpace'
        reads_7d:
          description: Its reads (R-, one per space read) in the last 7 days, in those spaces.
          type: integer
          minimum: 0
        writes_7d:
          description: Writes in the last 7 days, in those spaces.
          type: integer
          minimum: 0
        last_seen_at:
          description: When it last used Memax (updated at most once a minute).
          $ref: '#/components/schemas/Timestamp'
        connected_by_kind:
          description: Who connected it (`memax` for a V1 credential carried over), when you can see that receipt.
          $ref: '#/components/schemas/ActorKind'
        connected_by:
          description: The person who connected it.
          $ref: '#/components/schemas/Id'
        disconnected_at:
          $ref: '#/components/schemas/Timestamp'
        created_receipt_id:
          $ref: '#/components/schemas/Id'
        last_receipt_id:
          $ref: '#/components/schemas/Id'
        created_at:
          description: When it was connected.
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    AgentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentConnection'

    AgentWeek:
      description: |
        What the agent did in the last 7 days, in your spaces: its reads, its
        writes, and what became of the memories it wrote.
      type: object
      additionalProperties: false
      required: [reads, writes, proposals, kept, rejected, waiting]
      properties:
        reads:
          description: Its reads (R-, one per space read).
          type: integer
          minimum: 0
        writes:
          description: Memories it proposed, kept or edited.
          type: integer
          minimum: 0
        proposals:
          description: Memories it wrote that went to Review.
          type: integer
          minimum: 0
        kept:
          description: Memories it wrote that are kept now.
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
        waiting:
          description: Memories it wrote that are still waiting in Review.
          type: integer
          minimum: 0

    AgentSession:
      description: One of the agent's sessions, from the session on its receipts and on its reads of the last 30 days.
      type: object
      additionalProperties: false
      required: [session_ref, reads, writes, last_at]
      properties:
        session_ref:
          $ref: '#/components/schemas/SessionRef'
        reads:
          description: Its reads in that session, in the last 30 days.
          type: integer
          minimum: 0
        writes:
          type: integer
          minimum: 0
        last_at:
          $ref: '#/components/schemas/Timestamp'

    AgentDetail:
      type: object
      additionalProperties: false
      required: [agent, this_week, recent_writes, sessions]
      properties:
        agent:
          $ref: '#/components/schemas/AgentConnection'
        this_week:
          $ref: '#/components/schemas/AgentWeek'
        recent_writes:
          description: Its latest receipts on memories, newest first (at most 10). Read a memory for its words.
          type: array
          items:
            $ref: '#/components/schemas/Receipt'
        sessions:
          description: Its latest sessions, most recent first (at most 10).
          type: array
          items:
            $ref: '#/components/schemas/AgentSession'

    AgentCommandResult:
      type: object
      additionalProperties: false
      required: [outcome, policy, agent, receipts]
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        policy:
          $ref: '#/components/schemas/PolicyDecision'
        agent:
          description: The connection after the change.
          $ref: '#/components/schemas/AgentConnection'
        receipts:
          description: |
            The receipts the command wrote, oldest first: one per space the
            change applies to, or none when there was nothing to change.
          type: array
          items:
            $ref: '#/components/schemas/Receipt'

    BriefItem:
      description: A memory item (`ref`) or a line of connective prose that cites what it rests on (`text`, `cites`).
      type: object
      additionalProperties: false
      properties:
        ref:
          $ref: '#/components/schemas/DisplayRef'
        text:
          type: string
          maxLength: 500
        cites:
          type: array
          items:
            $ref: '#/components/schemas/DisplayRef'

    BriefSection:
      type: object
      additionalProperties: false
      required: [key, heading, items]
      properties:
        key:
          $ref: '#/components/schemas/SectionKey'
        heading:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/BriefItem'

    Brief:
      description: One version (`B-`) of a space's Brief.
      type: object
      additionalProperties: false
      required: [id, version_id, ref, version, space_id, tenant_id, title, sections, facts, current, receipt_id, created_at]
      properties:
        id:
          description: The Brief's id, the same for every version.
          $ref: '#/components/schemas/Id'
        version_id:
          $ref: '#/components/schemas/Id'
        ref:
          $ref: '#/components/schemas/BriefRef'
        version:
          description: The version number; also the `ETag`.
          type: integer
          minimum: 1
        space_id:
          $ref: '#/components/schemas/Id'
        tenant_id:
          $ref: '#/components/schemas/Id'
        parent_version:
          description: The version it was revised from.
          type: integer
          minimum: 1
        title:
          type: string
        summary:
          type: string
        sections:
          type: array
          items:
            $ref: '#/components/schemas/BriefSection'
        facts:
          description: How many memories the version places or cites.
          type: integer
          minimum: 0
        current:
          description: Set on the version in force.
          type: boolean
        receipt_id:
          $ref: '#/components/schemas/Id'
        receipt:
          description: Who wrote this version, and why.
          $ref: '#/components/schemas/Receipt'
        created_at:
          $ref: '#/components/schemas/Timestamp'

    BriefResult:
      type: object
      additionalProperties: false
      required: [outcome, policy, brief, receipts]
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        policy:
          $ref: '#/components/schemas/PolicyDecision'
        brief:
          $ref: '#/components/schemas/Brief'
        receipts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Receipt'

    BriefVersionPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Brief'
        has_more:
          type: boolean
        next_cursor:
          $ref: '#/components/schemas/Cursor'

    TargetSettings:
      description: How a target is written.
      type: object
      additionalProperties: false
      required: [include, stale, size_budget]
      properties:
        include:
          $ref: '#/components/schemas/IncludeMode'
        stale:
          $ref: '#/components/schemas/StaleMode'
        size_budget:
          description: Bytes per file; the tool's own limit caps it.
          type: integer
          minimum: 1024
          maximum: 32768
        scoped:
          description: agents_md and chatgpt only.
          $ref: '#/components/schemas/ScopedMode'
        user_owned:
          description: Shims only. The person owns the file; Memax manages one marked block in it.
          type: boolean

    DeliveredFile:
      type: object
      additionalProperties: false
      required: [path, sha256]
      properties:
        path:
          $ref: '#/components/schemas/RepoPath'
        sha256:
          description: The file's drift hash as Memax believes it is on disk.
          $ref: '#/components/schemas/Sha256'
        observation:
          description: Set when the baseline is a hand edit Memax accepted (pulled or overwritten).
          $ref: '#/components/schemas/Id'
        held:
          description: |
            Set with `observation`. True while the proposals of the pull that
            accepted this edit wait in Review: nothing is written over the
            file until they are kept or rejected.
          type: boolean

    TargetHold:
      description: A file a pull holds, and the proposals it waits for.
      type: object
      additionalProperties: false
      required: [observation, path, proposals, since]
      properties:
        observation:
          description: The hand edit the pull accepted.
          $ref: '#/components/schemas/Id'
        path:
          $ref: '#/components/schemas/RepoPath'
        proposals:
          description: The pull's proposals that are still proposed.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DisplayRef'
        since:
          description: When the pull was made.
          $ref: '#/components/schemas/Timestamp'

    Delivered:
      description: What Memax believes is on disk.
      type: object
      additionalProperties: false
      required: [sha256, files]
      properties:
        compile_id:
          $ref: '#/components/schemas/Id'
        compile:
          description: The run whose output is on disk, if Memax wrote it.
          $ref: '#/components/schemas/CompileRef'
        sha256:
          $ref: '#/components/schemas/Sha256'
        files:
          type: array
          items:
            $ref: '#/components/schemas/DeliveredFile'
        at:
          $ref: '#/components/schemas/Timestamp'

    CompiledOutput:
      description: 'One output of a compile run: a file (`path`) or copy-out text (`label`).'
      type: object
      additionalProperties: false
      required: [sha256, drift_sha256, bytes, lines, refs, cites, dropped_for_budget]
      properties:
        path:
          $ref: '#/components/schemas/RepoPath'
        label:
          type: string
        sha256:
          $ref: '#/components/schemas/Sha256'
        drift_sha256:
          $ref: '#/components/schemas/Sha256'
        bytes:
          type: integer
          minimum: 0
        lines:
          type: integer
          minimum: 0
        refs:
          description: Memories whose statements it contains.
          type: array
          items:
            $ref: '#/components/schemas/DisplayRef'
        cites:
          description: Every memory it cites.
          type: array
          items:
            $ref: '#/components/schemas/DisplayRef'
        dropped_for_budget:
          description: Memories that didn't fit the size budget; they stay live over MCP.
          type: array
          items:
            $ref: '#/components/schemas/DisplayRef'
        user_owned:
          type: boolean

    CompileWarning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          description: The compiler's warning code, or `not_compiled` for what the server left out.
          type: string
        message:
          type: string
        path:
          type: string
        ref:
          type: string

    CompileRun:
      description: One compile (`C-`) of one target.
      type: object
      additionalProperties: false
      required:
        - id
        - ref
        - target_id
        - space_id
        - brief
        - brief_version
        - generation
        - status
        - input_sha256
        - bytes
        - lines
        - refs
        - dropped_for_budget
        - files
        - warnings
        - enqueued_at
        - started_at
        - compiled_at
        - receipt_id
      properties:
        id:
          $ref: '#/components/schemas/Id'
        ref:
          $ref: '#/components/schemas/CompileRef'
        target_id:
          $ref: '#/components/schemas/Id'
        space_id:
          $ref: '#/components/schemas/Id'
        brief:
          $ref: '#/components/schemas/BriefRef'
        brief_version:
          type: integer
          minimum: 1
        generation:
          description: The target generation it compiled.
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: '#/components/schemas/CompileStatus'
        input_sha256:
          $ref: '#/components/schemas/Sha256'
        output_sha256:
          $ref: '#/components/schemas/Sha256'
        drift_sha256:
          description: What a delivery is acknowledged against.
          $ref: '#/components/schemas/Sha256'
        bytes:
          type: integer
          minimum: 0
        lines:
          type: integer
          minimum: 0
        refs:
          type: array
          items:
            $ref: '#/components/schemas/DisplayRef'
        dropped_for_budget:
          type: array
          items:
            $ref: '#/components/schemas/DisplayRef'
        files:
          type: array
          items:
            $ref: '#/components/schemas/CompiledOutput'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/CompileWarning'
        error:
          description: Why a failed run failed. Names fields, never memory text.
          type: string
        enqueued_at:
          description: When the change it compiled was made.
          $ref: '#/components/schemas/Timestamp'
        started_at:
          $ref: '#/components/schemas/Timestamp'
        compiled_at:
          $ref: '#/components/schemas/Timestamp'
        delivered_at:
          $ref: '#/components/schemas/Timestamp'
        receipt_id:
          $ref: '#/components/schemas/Id'

    Target:
      description: A compiled file (or copy-out) of a space, and where it stands.
      type: object
      additionalProperties: false
      required:
        - id
        - space_id
        - tenant_id
        - kind
        - label
        - settings
        - delivery
        - sync_state
        - version
        - dirty_gen
        - compiled_gen
        - dirty_at
        - open_drift
        - created_receipt_id
        - last_receipt_id
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        space_id:
          $ref: '#/components/schemas/Id'
        tenant_id:
          $ref: '#/components/schemas/Id'
        kind:
          $ref: '#/components/schemas/TargetKind'
        path:
          description: A file, or a rules directory for scoped kinds. Absent for ChatGPT.
          $ref: '#/components/schemas/RepoPath'
        label:
          description: What people see, e.g. `AGENTS.md` or `ChatGPT project`.
          type: string
        settings:
          $ref: '#/components/schemas/TargetSettings'
        delivery:
          $ref: '#/components/schemas/Delivery'
        sync_state:
          $ref: '#/components/schemas/SyncState'
        version:
          description: The target's version; also the `ETag`.
          type: integer
          minimum: 1
        dirty_gen:
          description: Bumped by every change that affects the output.
          type: integer
          format: int64
          minimum: 1
        compiled_gen:
          description: The generation the latest compile covers.
          type: integer
          format: int64
          minimum: 0
        dirty_at:
          $ref: '#/components/schemas/Timestamp'
        last_compile:
          description: The latest run, whatever its status.
          $ref: '#/components/schemas/CompileRun'
        delivered:
          $ref: '#/components/schemas/Delivered'
        open_drift:
          description: Files with a hand edit waiting to be resolved.
          type: integer
          minimum: 0
        holds:
          description: The files a pull holds (the target is `held`); absent when none.
          type: array
          items:
            $ref: '#/components/schemas/TargetHold'
        created_receipt_id:
          $ref: '#/components/schemas/Id'
        last_receipt_id:
          $ref: '#/components/schemas/Id'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    TargetList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Target'

    TargetResult:
      type: object
      additionalProperties: false
      required: [outcome, policy, target, receipts]
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        policy:
          $ref: '#/components/schemas/PolicyDecision'
        target:
          $ref: '#/components/schemas/Target'
        receipts:
          description: The receipts the command wrote; none when it changed nothing.
          type: array
          items:
            $ref: '#/components/schemas/Receipt'

    PreviewOutput:
      description: One compiled output with its content.
      type: object
      additionalProperties: false
      required: [content, sha256, drift_sha256, bytes, lines, refs, cites, dropped_for_budget]
      properties:
        path:
          $ref: '#/components/schemas/RepoPath'
        label:
          type: string
        content:
          type: string
        sha256:
          $ref: '#/components/schemas/Sha256'
        drift_sha256:
          $ref: '#/components/schemas/Sha256'
        bytes:
          type: integer
          minimum: 0
        lines:
          type: integer
          minimum: 0
        refs:
          type: array
          items:
            $ref: '#/components/schemas/DisplayRef'
        cites:
          type: array
          items:
            $ref: '#/components/schemas/DisplayRef'
        dropped_for_budget:
          type: array
          items:
            $ref: '#/components/schemas/DisplayRef'
        user_owned:
          type: boolean

    TargetPreview:
      type: object
      additionalProperties: false
      required: [target, files, copies]
      properties:
        target:
          $ref: '#/components/schemas/Target'
        compile:
          description: The latest good run, whose content this is. Absent before the first compile.
          $ref: '#/components/schemas/CompileRun'
        reads:
          description: The canonical file this tool also reads, e.g. `AGENTS.md` for Cursor.
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/PreviewOutput'
        copies:
          description: Copy-out text (ChatGPT project instructions).
          type: array
          items:
            $ref: '#/components/schemas/PreviewOutput'

    CompileRunPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompileRun'
        has_more:
          type: boolean
        next_cursor:
          $ref: '#/components/schemas/Cursor'

    DriftChange:
      description: |
        One change the compiler read back from a hand edit: `edit` (a cited
        line's words changed: `ref`, `refs`, `old_text`, `new_text`,
        `old_line`, `new_line`), `new` (a line with no matching cite:
        `text`, `line`, `section`, `paths`, `cites`) or `remove` (a cited
        line is gone: `ref`, `refs`, `old_text`, `old_line`).
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/ChangeKind'
        ref:
          type: string
        refs:
          type: array
          items:
            type: string
        old_text:
          type: string
        new_text:
          type: string
        old_line:
          type: integer
        new_line:
          type: integer
        text:
          type: string
        line:
          type: integer
        section:
          description: The heading it was added under.
          type: [string, 'null']
        paths:
          type: array
          items:
            type: string
        cites:
          type: array
          items:
            type: string

    DriftInfo:
      type: object
      additionalProperties: false
      required: [changed, header_edited, frontmatter_edited, layout_edited, managed_block, hidden_characters]
      properties:
        changed:
          type: boolean
        header_edited:
          type: boolean
        frontmatter_edited:
          type: boolean
        layout_edited:
          type: boolean
        managed_block:
          description: For a file the person owns, the state of Memax's block.
          type: [string, 'null']
          enum: [intact, edited, removed, null]
        hidden_characters:
          description: Hidden characters in the edited file; they never reach a proposal.
          type: integer
          minimum: 0

    ChangeSet:
      type: object
      additionalProperties: false
      required: [changes, drift]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/DriftChange'
        drift:
          $ref: '#/components/schemas/DriftInfo'

    ChangeResult:
      description: What resolving a hand edit did with one change.
      type: object
      additionalProperties: false
      required: [kind, line, outcome]
      properties:
        kind:
          $ref: '#/components/schemas/ChangeKind'
        line:
          type: integer
        ref:
          description: The memory the change is about (edits and removals).
          type: string
        outcome:
          $ref: '#/components/schemas/ChangeOutcome'
        proposal:
          description: The proposal written for it.
          $ref: '#/components/schemas/DisplayRef'
        reason:
          description: Why it was skipped (a policy code, or too_long, empty, invalid_text).
          type: string

    DriftResolutionRecord:
      type: object
      additionalProperties: false
      required: [receipt_id]
      properties:
        mode:
          $ref: '#/components/schemas/DriftMode'
        receipt_id:
          $ref: '#/components/schemas/Id'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ChangeResult'
        superseded_by:
          description: A newer observation of the same file that dismissed this one.
          $ref: '#/components/schemas/Id'

    Observation:
      description: A compiled file seen changed outside Memax.
      type: object
      additionalProperties: false
      required: [id, target_id, space_id, path, observed_sha256, observer_kind, observer_id, bytes, changeset, status, observed_at, receipt_id]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        target_id:
          $ref: '#/components/schemas/Id'
        space_id:
          $ref: '#/components/schemas/Id'
        path:
          $ref: '#/components/schemas/RepoPath'
        observed_sha256:
          $ref: '#/components/schemas/Sha256'
        observer_kind:
          $ref: '#/components/schemas/ObserverKind'
        observer_id:
          type: string
        commit:
          type: string
        bytes:
          type: integer
          minimum: 0
        base_compile_id:
          $ref: '#/components/schemas/Id'
        base_compile:
          description: The run the edit was compared against, when Memax wrote the baseline.
          $ref: '#/components/schemas/CompileRef'
        base_sha256:
          $ref: '#/components/schemas/Sha256'
        changeset:
          $ref: '#/components/schemas/ChangeSet'
        status:
          $ref: '#/components/schemas/ObservationStatus'
        resolution:
          $ref: '#/components/schemas/DriftResolutionRecord'
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        resolved_at:
          $ref: '#/components/schemas/Timestamp'
        receipt_id:
          $ref: '#/components/schemas/Id'

    ObservationResult:
      type: object
      additionalProperties: false
      required: [drifted, target, receipts]
      properties:
        drifted:
          description: Whether the file was a hand edit (and recorded).
          type: boolean
        target:
          $ref: '#/components/schemas/Target'
        observation:
          $ref: '#/components/schemas/Observation'
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/Receipt'

    DeliveryResult:
      type: object
      additionalProperties: false
      required: [target, compile, receipts]
      properties:
        target:
          $ref: '#/components/schemas/Target'
        compile:
          $ref: '#/components/schemas/CompileRun'
        receipts:
          description: Empty when the delivery was already known.
          type: array
          items:
            $ref: '#/components/schemas/Receipt'

    DriftItem:
      type: object
      additionalProperties: false
      required: [observation, compiled, observed]
      properties:
        observation:
          $ref: '#/components/schemas/Observation'
        compiled:
          description: The file as Memax last delivered (or accepted) it; empty if it never wrote one.
          type: string
        base_compile:
          $ref: '#/components/schemas/CompileRun'
        observed:
          description: The file as it is now.
          type: string

    Drift:
      type: object
      additionalProperties: false
      required: [target, items]
      properties:
        target:
          $ref: '#/components/schemas/Target'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DriftItem'

    DriftResolutionResult:
      type: object
      additionalProperties: false
      required: [outcome, policy, target, observations, proposals, receipts]
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        policy:
          $ref: '#/components/schemas/PolicyDecision'
        target:
          $ref: '#/components/schemas/Target'
        observations:
          description: The hand edits resolved.
          type: array
          items:
            $ref: '#/components/schemas/Observation'
        proposals:
          description: The proposals a pull wrote, in file order.
          type: array
          items:
            $ref: '#/components/schemas/Memory'
        receipts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Receipt'

    # ------------------------------------------------------------------
    # Decision gates
    # ------------------------------------------------------------------
    GateOption:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
        detail:
          description: What choosing it means.
          type: string
          maxLength: 500

    GateAnswer:
      description: How a person answered, and the decision it became.
      type: object
      additionalProperties: false
      required: [option, label, memory, answered_by, answered_at, assurance]
      properties:
        option:
          description: The chosen option, counting from 1.
          type: integer
          minimum: 1
          maximum: 4
        label:
          type: string
        memory:
          description: The kept decision the answer became.
          $ref: '#/components/schemas/MemoryPointer'
        answered_by:
          description: The person who answered.
          $ref: '#/components/schemas/Id'
        answered_at:
          $ref: '#/components/schemas/Timestamp'
        assurance:
          $ref: '#/components/schemas/Assurance'

    GateWithdrawal:
      description: Who took the question back, and when.
      type: object
      additionalProperties: false
      required: [by_kind, by, at]
      properties:
        by_kind:
          description: '`agent`: the one that asked. `person`: the person it works for, or someone who could answer.'
          type: string
          enum: [agent, person]
        by:
          description: The agent connection or the person.
          $ref: '#/components/schemas/Id'
        at:
          $ref: '#/components/schemas/Timestamp'

    Gate:
      description: 'A decision gate (G-): a question an agent asked a person.'
      type: object
      additionalProperties: false
      required:
        - id
        - ref
        - space_id
        - tenant_id
        - question
        - options
        - status
        - expires_at
        - asked_by
        - needs_web
        - version
        - created_receipt_id
        - last_receipt_id
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        ref:
          $ref: '#/components/schemas/GateDisplayRef'
        space_id:
          $ref: '#/components/schemas/Id'
        tenant_id:
          $ref: '#/components/schemas/Id'
        question:
          description: One question, in the asking agent's words.
          type: string
        context:
          description: Why it matters, from the agent.
          type: string
        options:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/GateOption'
        status:
          $ref: '#/components/schemas/GateStatus'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        asked_by:
          description: The agent connection that asked.
          $ref: '#/components/schemas/Id'
        agent:
          description: The agent that asked, e.g. codex.
          type: string
        session_ref:
          description: The agent session it asked from.
          type: string
        needs_web:
          description: >-
            Answering needs a person on the web: the space's rule for
            decisions (team spaces by default). The CLI and in-agent answers
            are refused.
          type: boolean
        answer:
          $ref: '#/components/schemas/GateAnswer'
        withdrawn:
          $ref: '#/components/schemas/GateWithdrawal'
        delivered_at:
          description: When the agent that asked was told how it ended.
          $ref: '#/components/schemas/Timestamp'
        version:
          description: Changes when the gate ends. Send it back as `If-Match`.
          type: integer
          minimum: 1
        created_receipt_id:
          $ref: '#/components/schemas/Id'
        last_receipt_id:
          $ref: '#/components/schemas/Id'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    GatePage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Gate'
        has_more:
          type: boolean
        next_cursor:
          $ref: '#/components/schemas/Cursor'

    GateResult:
      type: object
      additionalProperties: false
      required: [outcome, policy, gate, receipts]
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        policy:
          $ref: '#/components/schemas/PolicyDecision'
        gate:
          $ref: '#/components/schemas/Gate'
        memory:
          description: For an answer, the kept decision it became.
          $ref: '#/components/schemas/Memory'
        receipts:
          description: The receipts the command wrote, oldest first.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Receipt'

    # ------------------------------------------------------------------
    # Requests
    # ------------------------------------------------------------------
    SourceInput:
      description: A source a new memory cites.
      type: object
      additionalProperties: false
      required: [kind, ref]
      properties:
        kind:
          $ref: '#/components/schemas/SourceKind'
        ref:
          description: What people see, e.g. "PR #212".
          type: string
          minLength: 1
          maxLength: 500
        uri:
          type: string
          maxLength: 2048
        locator:
          type: object
          additionalProperties: true
        external:
          description: |
            Third-party content. URL, email and issue sources are external
            whatever this says.
          type: boolean
        trust:
          description: |
            The source's class as you assert it: `person` for your own
            words (your global instructions file), `agent_own_work` for an
            agent's notes. Memax holds it to what you could write yourself
            (an agent's own work at most, for an agent); without it, a file
            or PR is `repository` and an import `external`. An import holds
            a repository file's statements to `repository`, whatever this
            says.
          $ref: '#/components/schemas/Trust'
        quote:
          description: The supporting excerpt.
          type: string
          maxLength: 4000
        content_hash:
          type: string
          maxLength: 255

    NearDuplicatesRequest:
      description: A draft statement to check before remembering it.
      type: object
      additionalProperties: false
      required: [statement]
      properties:
        statement:
          description: The draft, as the person has typed it so far.
          type: string
          minLength: 1
          maxLength: 2000
        limit:
          description: The most repeats to return (default 3).
          type: integer
          minimum: 1
          maximum: 5

    NearDuplicates:
      description: What a draft repeats.
      type: object
      additionalProperties: false
      required: [items, semantic, floor]
      properties:
        items:
          description: Best first. Exact repeats come before near ones.
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/NearDuplicate'
        semantic:
          description: |
            The draft was compared by meaning. `false` when embeddings are
            off on this server or the draft's embedding missed its deadline:
            only exact repeats were checked.
          type: boolean
        floor:
          description: The least similarity a near repeat needed.
          type: number
          minimum: 0
          maximum: 1

    NearDuplicate:
      description: A memory a draft repeats.
      type: object
      additionalProperties: false
      required: [memory, similarity, match, created]
      properties:
        memory:
          description: A kept memory or a pending proposal (its `lifecycle` says which).
          $ref: '#/components/schemas/Memory'
        similarity:
          description: Cosine similarity of the draft and the memory; 1 for an exact repeat.
          type: number
          minimum: -1
          maximum: 1
        match:
          $ref: '#/components/schemas/DuplicateMatch'
        created:
          description: The receipt that wrote the memory, so a client can say who proposed or kept it, through which agent, and when.
          $ref: '#/components/schemas/Receipt'

    DuplicateMatch:
      description: '`exact`: the same words. `near`: the same thing by meaning.'
      type: string
      enum: [exact, near]

    RememberRequest:
      type: object
      additionalProperties: false
      required: [statement, section]
      properties:
        statement:
          description: One fact, in your words.
          type: string
          minLength: 1
          maxLength: 2000
        section:
          $ref: '#/components/schemas/Section'
        kind:
          description: Defaults to fact.
          $ref: '#/components/schemas/MemoryKind'
        decision:
          description: Only for kind decision.
          $ref: '#/components/schemas/Decision'
        sources:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/SourceInput'
        stale_after:
          description: When it should be verified again.
          $ref: '#/components/schemas/Timestamp'
        conditions:
          description: '"Stays true while" conditions.'
          type: array
          items: true
        scope:
          description: 'Where it applies, e.g. {"paths": ["packages/web/**"]}.'
          type: object
          additionalProperties: true
        valid_from:
          $ref: '#/components/schemas/Timestamp'
        valid_to:
          $ref: '#/components/schemas/Timestamp'
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          description: When it happened on the client; offline queues keep the original time.
          $ref: '#/components/schemas/Timestamp'
        session_ref:
          $ref: '#/components/schemas/SessionRef'

    RequestDecisionRequest:
      type: object
      additionalProperties: false
      required: [question, options]
      properties:
        question:
          description: The decision, as one question.
          type: string
          minLength: 1
          maxLength: 300
        context:
          description: Why it matters; the tradeoffs, and a recommendation if there is one.
          type: string
          maxLength: 2000
        options:
          description: Two to four different answers, in order.
          type: array
          minItems: 2
          maxItems: 4
          items:
            $ref: '#/components/schemas/GateOption'
        expires_at:
          description: When the agent stops waiting. Defaults to 7 days from now; between 5 minutes and 30 days.
          $ref: '#/components/schemas/Timestamp'
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          description: When it happened on the client; offline queues keep the original time.
          $ref: '#/components/schemas/Timestamp'
        session_ref:
          $ref: '#/components/schemas/SessionRef'

    AnswerGateRequest:
      type: object
      additionalProperties: false
      required: [option]
      properties:
        option:
          description: The chosen option, counting from 1.
          type: integer
          minimum: 1
          maximum: 4
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          description: When it happened on the client; offline queues keep the original time.
          $ref: '#/components/schemas/Timestamp'
        session_ref:
          $ref: '#/components/schemas/SessionRef'

    ReviewRequest:
      description: The body of keep, reject, compile and withdrawing a gate. Every field is optional.
      type: object
      additionalProperties: false
      properties:
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          description: When it happened on the client; offline queues keep the original time.
          $ref: '#/components/schemas/Timestamp'
        session_ref:
          $ref: '#/components/schemas/SessionRef'

    ResolveConflictRequest:
      type: object
      additionalProperties: false
      required: [choice]
      properties:
        choice:
          $ref: '#/components/schemas/ConflictChoice'
        other:
          description: The other side, by display ID or id, when this memory has more than one conflict.
          $ref: '#/components/schemas/MemoryRef'
        statement:
          description: keep_both only. Narrower words for this memory.
          type: string
          minLength: 1
          maxLength: 2000
        other_statement:
          description: keep_both only. Narrower words for the other side.
          type: string
          minLength: 1
          maxLength: 2000
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          description: When it happened on the client; offline queues keep the original time.
          $ref: '#/components/schemas/Timestamp'
        session_ref:
          $ref: '#/components/schemas/SessionRef'

    AutonomyRequest:
      type: object
      additionalProperties: false
      required: [autonomy]
      properties:
        autonomy:
          $ref: '#/components/schemas/Autonomy'
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          description: When it happened on the client; offline queues keep the original time.
          $ref: '#/components/schemas/Timestamp'

    AgentCommandRequest:
      description: The body of pause, resume and disconnect. Every field is optional.
      type: object
      additionalProperties: false
      properties:
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          description: When it happened on the client; offline queues keep the original time.
          $ref: '#/components/schemas/Timestamp'

    EditRequest:
      type: object
      additionalProperties: false
      required: [statement]
      properties:
        statement:
          description: The new words.
          type: string
          minLength: 1
          maxLength: 2000
        section:
          description: Moves the memory; omit to leave it where it is.
          $ref: '#/components/schemas/Section'
        keep:
          description: Also keep a proposal after editing it (Review's edit and keep).
          type: boolean
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          description: When it happened on the client; offline queues keep the original time.
          $ref: '#/components/schemas/Timestamp'
        session_ref:
          $ref: '#/components/schemas/SessionRef'

    BriefItemInput:
      description: A memory item (`ref`) or a line of prose that cites at least one kept memory (`text`, `cites`).
      type: object
      additionalProperties: false
      properties:
        ref:
          $ref: '#/components/schemas/MemoryDisplayRef'
        text:
          type: string
          minLength: 1
          maxLength: 500
        cites:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/MemoryDisplayRef'

    BriefSectionInput:
      type: object
      additionalProperties: false
      required: [key, heading]
      properties:
        key:
          $ref: '#/components/schemas/SectionKey'
        heading:
          type: string
          minLength: 1
          maxLength: 80
        items:
          type: array
          maxItems: 400
          items:
            $ref: '#/components/schemas/BriefItemInput'

    ReviseBriefRequest:
      type: object
      additionalProperties: false
      required: [title, sections]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        summary:
          description: One line under the title.
          type: string
          maxLength: 500
        sections:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/BriefSectionInput'
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          description: When it happened on the client; offline queues keep the original time.
          $ref: '#/components/schemas/Timestamp'
        session_ref:
          $ref: '#/components/schemas/SessionRef'

    TargetSettingsInput:
      description: Settings to change; what you leave out stays.
      type: object
      additionalProperties: false
      properties:
        include:
          $ref: '#/components/schemas/IncludeMode'
        stale:
          $ref: '#/components/schemas/StaleMode'
        size_budget:
          type: integer
          minimum: 1024
          maximum: 32768
        scoped:
          $ref: '#/components/schemas/ScopedMode'
        user_owned:
          type: boolean

    CreateTargetRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/TargetKind'
        path:
          description: Defaults to the kind's own (AGENTS.md, CLAUDE.md, .cursor/rules, …). ChatGPT takes none.
          $ref: '#/components/schemas/RepoPath'
        settings:
          $ref: '#/components/schemas/TargetSettingsInput'
        delivery:
          description: Defaults to local for files and copy for ChatGPT.
          $ref: '#/components/schemas/Delivery'
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        session_ref:
          $ref: '#/components/schemas/SessionRef'

    ConfigureTargetRequest:
      type: object
      additionalProperties: false
      properties:
        path:
          $ref: '#/components/schemas/RepoPath'
        settings:
          $ref: '#/components/schemas/TargetSettingsInput'
        delivery:
          $ref: '#/components/schemas/Delivery'
        enabled:
          description: false stops compiling the target; true turns it back on.
          type: boolean
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        session_ref:
          $ref: '#/components/schemas/SessionRef'

    ObservationRequest:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path:
          description: The file, relative to the repository root.
          $ref: '#/components/schemas/RepoPath'
        content:
          description: The file's content as it is on disk.
          type: string
          maxLength: 1048576
        device_id:
          description: The device that saw it, for the record.
          type: string
          minLength: 1
          maxLength: 200
        commit:
          description: The commit the file is at, if the device knows it.
          type: string
          pattern: '^[0-9a-f]{7,64}$'
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          description: When the device saw it.
          $ref: '#/components/schemas/Timestamp'
        session_ref:
          $ref: '#/components/schemas/SessionRef'

    DeliveryRequest:
      type: object
      additionalProperties: false
      required: [compile, sha256]
      properties:
        compile:
          description: The run you wrote, by display ID (C-0881) or id.
          type: string
          minLength: 1
          maxLength: 64
        sha256:
          description: The run's drift hash, computed from what you wrote.
          $ref: '#/components/schemas/Sha256'
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          description: When it was written.
          $ref: '#/components/schemas/Timestamp'
        session_ref:
          $ref: '#/components/schemas/SessionRef'

    ResolveDriftRequest:
      description: Every field is optional.
      type: object
      additionalProperties: false
      properties:
        observation:
          description: Resolve only this file's edit; without it, every open one of the target.
          $ref: '#/components/schemas/Id'
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        session_ref:
          $ref: '#/components/schemas/SessionRef'

    # ------------------------------------------------------------------
    # Ask
    # ------------------------------------------------------------------
    AskRequest:
      description: A person's question.
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          description: The question, as the person typed it.
          type: string
          minLength: 1
          maxLength: 2000

    AskEvent:
      description: |
        One event of an answer's stream: `event` is the server-sent event's
        name and `data` its JSON payload. The stream is one `sources`, then
        `delta` and `cite` in answer order, then `done` (or `error`).
      oneOf:
        - $ref: '#/components/schemas/AskSourcesEvent'
        - $ref: '#/components/schemas/AskDeltaEvent'
        - $ref: '#/components/schemas/AskCiteEvent'
        - $ref: '#/components/schemas/AskDoneEvent'
        - $ref: '#/components/schemas/AskErrorEvent'
      discriminator:
        propertyName: event
        mapping:
          sources: '#/components/schemas/AskSourcesEvent'
          delta: '#/components/schemas/AskDeltaEvent'
          cite: '#/components/schemas/AskCiteEvent'
          done: '#/components/schemas/AskDoneEvent'
          error: '#/components/schemas/AskErrorEvent'

    AskSourcesEvent:
      type: object
      additionalProperties: false
      required: [event, data]
      properties:
        event:
          const: sources
        data:
          $ref: '#/components/schemas/AskSources'

    AskDeltaEvent:
      type: object
      additionalProperties: false
      required: [event, data]
      properties:
        event:
          const: delta
        data:
          $ref: '#/components/schemas/AskDelta'

    AskCiteEvent:
      type: object
      additionalProperties: false
      required: [event, data]
      properties:
        event:
          const: cite
        data:
          $ref: '#/components/schemas/AskCite'

    AskDoneEvent:
      type: object
      additionalProperties: false
      required: [event, data]
      properties:
        event:
          const: done
        data:
          $ref: '#/components/schemas/AskDone'

    AskErrorEvent:
      type: object
      additionalProperties: false
      required: [event, data]
      properties:
        event:
          const: error
        data:
          $ref: '#/components/schemas/AskFailure'

    AskSources:
      description: The kept memories the answer may cite, best match first. Sent once, before any words.
      type: object
      additionalProperties: false
      required: [sources, answering, lexical_only]
      properties:
        sources:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AskSource'
        answering:
          description: '`false` when answers are off on this server: `done` follows at once, with outcome `sources_only`.'
          type: boolean
        lexical_only:
          description: The search matched words, not meaning (embeddings off, or the query's embedding was late).
          type: boolean

    AskSource:
      description: One kept memory an answer may cite.
      type: object
      additionalProperties: false
      required: [id, ref, statement, section, kind, state, trust, version]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        ref:
          $ref: '#/components/schemas/DisplayRef'
        statement:
          type: string
        section:
          $ref: '#/components/schemas/Section'
        kind:
          $ref: '#/components/schemas/MemoryKind'
        state:
          $ref: '#/components/schemas/State'
        trust:
          $ref: '#/components/schemas/Trust'
        version:
          type: integer
          minimum: 1
        receipt:
          description: How it came to read as it does, for the source's receipt line ("kept by ZZ · Oct 2").
          $ref: '#/components/schemas/Receipt'

    AskDelta:
      description: The answer's next words, citations removed.
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1

    AskCite:
      description: A citation at this point of the answer, of one of the sources.
      type: object
      additionalProperties: false
      required: [n, ref]
      properties:
        n:
          description: The cited memory's number, in the order memories are first cited, from 1.
          type: integer
          minimum: 1
        ref:
          $ref: '#/components/schemas/DisplayRef'

    AskOutcome:
      description: |
        How an answer ended. `answered`: words with at least one citation.
        `not_covered`: nothing kept matched, or the memories don't answer
        it. `unsupported`: the model answered, but no citation named a
        memory it was given; don't show it as an answer. `sources_only`:
        answers are off; the sources are the answer.
      type: string
      enum: [answered, not_covered, unsupported, sources_only]

    AskDone:
      description: The end of an answer.
      type: object
      additionalProperties: false
      required: [outcome, cited, dropped, usage]
      properties:
        outcome:
          $ref: '#/components/schemas/AskOutcome'
        cited:
          description: The memories cited, in `n` order.
          type: array
          items:
            $ref: '#/components/schemas/DisplayRef'
        dropped:
          description: Citations removed because they named a memory the model wasn't given.
          type: integer
          minimum: 0
        usage:
          $ref: '#/components/schemas/AskUsage'

    AskUsage:
      description: What the answer used, and how long it took.
      type: object
      additionalProperties: false
      required: [input_tokens, output_tokens, retrieval_ms, total_ms]
      properties:
        model:
          description: The answer tier's model, when one answered.
          type: string
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        retrieval_ms:
          type: integer
          minimum: 0
        first_token_ms:
          description: From the request to the answer's first words, when any came.
          type: integer
          minimum: 0
        total_ms:
          type: integer
          minimum: 0

    AskFailureCode:
      description: '`answer_failed`: the model failed or ran out of time partway; what streamed so far stays, and the person can ask again.'
      type: string
      enum: [answer_failed]

    AskFailure:
      description: Why an answer stopped partway.
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/AskFailureCode'
        message:
          description: What happened and what to do, in English.
          type: string

    # ------------------------------------------------------------------
    # Envelopes
    # ------------------------------------------------------------------
    # ------------------------------------------------------------------
    # Spaces, imports and bulk review (memax init, Cleanup, ReviewImport)
    # ------------------------------------------------------------------
    CreateSpaceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          description: Lowercase letters, digits and hyphens, 4 to 50 characters. Without one, Memax picks one from the name.
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{2,48}[a-z0-9]$'
        kind:
          description: Only project spaces are created here; the default.
          type: string
          enum: [project]
        repository:
          description: The repository the space compiles for, "owner/name".
          type: string
          maxLength: 200

    ImportLocation:
      description: |
        Where a file an import read lives: `repository` (shared with
        everyone who clones it) or `home` (on the person's machine only).
      type: string
      enum: [repository, home]
    ImportOutcome:
      description: |
        What became of one statement: `proposed` (a new proposal),
        `folded` (it repeats another statement of the upload, whose proposal
        cites it too), `existing` (the space already has it) or `refused`
        (policy refused it; see `policy`).
      type: string
      enum: [proposed, folded, existing, refused]
    ImportSkipReason:
      description: |
        Why the client kept a statement on the machine: `secret` (it holds
        a credential), `too_long` (longer than a statement can be) or
        `limit` (the file has more statements than one import takes).
      type: string
      enum: [secret, too_long, limit]
    ImportCheckState:
      description: |
        How far the import's conflict check got: `pending`, `checked`,
        `no_model` (no model is configured: only the judge's repeats check
        ran), `failed` (the model gave no answer; nothing was flagged) or
        `skipped` (fewer than two proposals to compare).
      type: string
      enum: [pending, checked, no_model, failed, skipped]
    ImportHeld:
      description: |
        Why a proposal can't be kept in bulk: `decided` (it isn't waiting in
        Review any more), `conflict` (it disagrees with another statement or
        a decision in force), `quarantined` (it cites an outside source),
        `checking` (the judge or the conflict check hasn't finished),
        `unchecked` (the judge couldn't reach a verdict), `stale`, or
        `hidden_characters` (its line had hidden characters: read it first).
      type: string
      enum: [decided, conflict, quarantined, checking, hidden_characters, stale, unchecked]
    ImportChoice:
      description: |
        How a disagreement is settled: `keep_one`, `keep_all`, `leave_open`
        or `keep_suggestion`.
      type: string
      enum: [keep_one, keep_all, leave_open, keep_suggestion]
    ImportFileKind:
      description: The client's name for a file's role, e.g. claude_md, agents_md, cursor_rule, claude_memory, codex_memory.
      type: string
      pattern: '^[a-z][a-z0-9_]{0,39}$'

    ImportFile:
      description: One file an import read. Never its contents.
      type: object
      additionalProperties: false
      required: [path, kind, location, statements, skipped, hidden_characters]
      properties:
        path:
          description: What people see, e.g. "CLAUDE.md" or "~/.codex/memories/notes.md".
          type: string
          minLength: 1
          maxLength: 500
        kind:
          $ref: '#/components/schemas/ImportFileKind'
        agent:
          description: The agent the file belongs to, e.g. claude-code.
          type: string
          maxLength: 64
        location:
          $ref: '#/components/schemas/ImportLocation'
        trust:
          description: The class the file's statements were sent at.
          $ref: '#/components/schemas/Trust'
        statements:
          description: The statements found in it.
          type: integer
          minimum: 0
        skipped:
          description: The statements the client kept on the machine.
          type: integer
          minimum: 0
        hidden_characters:
          description: The hidden characters the client removed from it.
          type: integer
          minimum: 0

    ImportSkip:
      description: A statement the client didn't send, and why. A ref and a rule, never its words.
      type: object
      additionalProperties: false
      required: [ref, reason]
      properties:
        ref:
          description: Where it is, e.g. "CLAUDE.md:31".
          type: string
          minLength: 1
          maxLength: 500
        reason:
          $ref: '#/components/schemas/ImportSkipReason'
        detail:
          description: The rule that matched, e.g. "GitHub token". Never the matched text.
          type: string
          maxLength: 100

    ImportItemInput:
      description: One statement of an import.
      type: object
      additionalProperties: false
      required: [key, location, statement, section]
      properties:
        key:
          description: Unique within the request; the item's result carries it back.
          type: string
          pattern: '^[A-Za-z0-9._:-]{1,64}$'
        ref:
          description: Where it came from, e.g. "CLAUDE.md:12". Defaults to its first source's ref.
          type: string
          maxLength: 500
        location:
          $ref: '#/components/schemas/ImportLocation'
        hidden_characters:
          description: The hidden characters the client removed from it.
          type: integer
          minimum: 0
        statement:
          type: string
          minLength: 1
          maxLength: 2000
        section:
          $ref: '#/components/schemas/Section'
        kind:
          $ref: '#/components/schemas/MemoryKind'
        decision:
          $ref: '#/components/schemas/Decision'
        sources:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/SourceInput'
        scope:
          description: 'Where it applies, e.g. {"paths": ["**/*.test.ts"]} from a scoped rule.'
          type: object
          additionalProperties: true

    ImportRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        client:
          description: The uploader, e.g. "memax-cli 0.3.0".
          type: string
          maxLength: 100
        files:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ImportFile'
        skipped:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ImportSkip'
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ImportItemInput'
        occurred_at:
          description: When the files were read.
          $ref: '#/components/schemas/Timestamp'
        session_ref:
          description: The run that read them, e.g. "init-7f3a"; every statement's receipt carries it.
          $ref: '#/components/schemas/SessionRef'

    ImportCounts:
      description: An import's statements by outcome, and its disagreements.
      type: object
      additionalProperties: false
      required: [items, proposed, folded, existing, refused, conflicts]
      properties:
        items:
          type: integer
          minimum: 0
        proposed:
          type: integer
          minimum: 0
        folded:
          type: integer
          minimum: 0
        existing:
          type: integer
          minimum: 0
        refused:
          type: integer
          minimum: 0
        conflicts:
          type: integer
          minimum: 0

    ImportCheck:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/ImportCheckState'
        checked_at:
          $ref: '#/components/schemas/Timestamp'
        tier:
          $ref: '#/components/schemas/ModelTier'
        model:
          type: string

    Import:
      description: One upload of statements read from agent files.
      type: object
      additionalProperties: false
      required: [id, space_id, tenant_id, actor_kind, files, skipped, counts, check, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        space_id:
          $ref: '#/components/schemas/Id'
        tenant_id:
          $ref: '#/components/schemas/Id'
        actor_kind:
          $ref: '#/components/schemas/ActorKind'
        actor_id:
          description: The person, or the agent connection, that uploaded it.
          $ref: '#/components/schemas/Id'
        agent:
          type: string
        client:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/ImportFile'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/ImportSkip'
        counts:
          $ref: '#/components/schemas/ImportCounts'
        uploaded_at:
          description: When every statement was written.
          $ref: '#/components/schemas/Timestamp'
        check:
          $ref: '#/components/schemas/ImportCheck'
        created_at:
          $ref: '#/components/schemas/Timestamp'

    ImportItemResult:
      description: What became of one statement of the request.
      type: object
      additionalProperties: false
      required: [key, position, ref, outcome]
      properties:
        key:
          type: string
        position:
          description: Its index in the request.
          type: integer
          minimum: 0
        ref:
          type: string
        outcome:
          $ref: '#/components/schemas/ImportOutcome'
        memory:
          description: The proposal it became (folded, the one it folded into), or the memory the space already had.
          $ref: '#/components/schemas/MemoryPointer'
        lifecycle:
          description: That memory's lifecycle, for an existing one.
          $ref: '#/components/schemas/Lifecycle'
        folded_into:
          description: The key of the item it folded into.
          type: string
        policy:
          description: Why it was refused.
          $ref: '#/components/schemas/PolicyDecision'

    ImportResult:
      type: object
      additionalProperties: false
      required: [import, items]
      properties:
        import:
          $ref: '#/components/schemas/Import'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportItemResult'

    ImportItem:
      description: What became of one statement, as the import shows it.
      type: object
      additionalProperties: false
      required: [position, key, ref, location, outcome, hidden_characters]
      properties:
        position:
          type: integer
          minimum: 0
        key:
          type: string
        ref:
          type: string
        location:
          $ref: '#/components/schemas/ImportLocation'
        outcome:
          $ref: '#/components/schemas/ImportOutcome'
        memory:
          $ref: '#/components/schemas/MemoryPointer'
        folded_into:
          description: The position of the item it folded into.
          type: integer
          minimum: 0
        code:
          description: The policy code it was refused with.
          type: string
        hidden_characters:
          type: integer
          minimum: 0

    ImportMemory:
      description: A memory an import proposed or found, and whether it can be kept in bulk.
      type: object
      additionalProperties: false
      required: [memory, outcome, items, bulk]
      properties:
        memory:
          $ref: '#/components/schemas/Memory'
        outcome:
          description: proposed (this import proposed it) or existing.
          $ref: '#/components/schemas/ImportOutcome'
        items:
          description: The import's statements it stands for, folded repeats included ("Three files agree").
          type: integer
          minimum: 1
        bulk:
          description: It can be kept in bulk with the ones that agree.
          type: boolean
        held:
          $ref: '#/components/schemas/ImportHeld'
        conflict:
          description: The import disagreement it is in, by its `n`.
          type: integer
          minimum: 1

    ImportConflict:
      description: "A disagreement among an import's proposals (Test command, 3 files disagree)."
      type: object
      additionalProperties: false
      required: [id, n, members, state, created_receipt_id, last_receipt_id, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        n:
          description: Its number within the import ("1 of 3").
          type: integer
          minimum: 1
        subject:
          description: What they disagree about, in the model's words.
          type: string
        rationale:
          description: How they disagree, in the model's words.
          type: string
        suggestion:
          description: One statement that says what holds for all of them, when the model found one.
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        members:
          description: The proposals that disagree, in the import's order.
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/MemoryPointer'
        state:
          type: string
          enum: [open, settled]
        choice:
          $ref: '#/components/schemas/ImportChoice'
        chosen:
          description: The memory that holds (keep_one, keep_suggestion).
          $ref: '#/components/schemas/MemoryPointer'
        created_receipt_id:
          $ref: '#/components/schemas/Id'
        last_receipt_id:
          $ref: '#/components/schemas/Id'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        settled_at:
          $ref: '#/components/schemas/Timestamp'

    ImportProgress:
      description: How far the judge got with the import's proposals.
      type: object
      additionalProperties: false
      required: [proposals, working, judged, failed, ready]
      properties:
        proposals:
          type: integer
          minimum: 0
        working:
          type: integer
          minimum: 0
        judged:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        ready:
          description: Nothing is being judged and the conflict check is done.
          type: boolean

    ImportView:
      type: object
      additionalProperties: false
      required: [import, items, memories, conflicts, progress]
      properties:
        import:
          $ref: '#/components/schemas/Import'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportItem'
        memories:
          description: The memories the items became or matched, once each, in the order the items first name them.
          type: array
          items:
            $ref: '#/components/schemas/ImportMemory'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ImportConflict'
        progress:
          $ref: '#/components/schemas/ImportProgress'

    ImportPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Import'
        has_more:
          type: boolean
        next_cursor:
          $ref: '#/components/schemas/Cursor'

    SettleImportConflictRequest:
      type: object
      additionalProperties: false
      required: [choice]
      properties:
        choice:
          $ref: '#/components/schemas/ImportChoice'
        keep:
          description: keep_one only. The member to keep.
          $ref: '#/components/schemas/MemoryRef'
        statement:
          description: keep_suggestion only. The words to keep; without them, the check's suggestion.
          type: string
          minLength: 1
          maxLength: 2000
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          description: When it happened on the client; offline queues keep the original time.
          $ref: '#/components/schemas/Timestamp'
        session_ref:
          $ref: '#/components/schemas/SessionRef'

    ImportConflictResult:
      type: object
      additionalProperties: false
      required: [outcome, policy, conflict, memories, receipts]
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        policy:
          $ref: '#/components/schemas/PolicyDecision'
        conflict:
          $ref: '#/components/schemas/ImportConflict'
        memories:
          description: Every memory it changed, the members first.
          type: array
          items:
            $ref: '#/components/schemas/Memory'
        receipts:
          description: The receipts it wrote, oldest first.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Receipt'

    BulkReviewItemInput:
      type: object
      additionalProperties: false
      required: [memory]
      properties:
        memory:
          $ref: '#/components/schemas/MemoryRef'
        version:
          description: The version the person saw (its ETag); a newer one is reported as `edit_clash`.
          type: integer
          minimum: 1

    BulkReviewRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/BulkReviewItemInput'
        reason:
          $ref: '#/components/schemas/Reason'
        occurred_at:
          description: When it happened on the client; offline queues keep the original time.
          $ref: '#/components/schemas/Timestamp'
        session_ref:
          $ref: '#/components/schemas/SessionRef'

    BulkOutcome:
      description: '`applied` (kept, or rejected), `refused` (policy; see `policy`) or `failed` (see `error`).'
      type: string
      enum: [applied, refused, failed]

    BulkReviewItem:
      type: object
      additionalProperties: false
      required: [memory, outcome]
      properties:
        memory:
          description: The memory as the request named it.
          type: string
        ref:
          $ref: '#/components/schemas/DisplayRef'
        outcome:
          $ref: '#/components/schemas/BulkOutcome'
        state:
          description: Its state now.
          $ref: '#/components/schemas/State'
        version:
          type: integer
          minimum: 1
        policy:
          $ref: '#/components/schemas/PolicyDecision'
        error:
          description: Why it failed, as the one-memory command would have answered.
          $ref: '#/components/schemas/Error'

    BulkReviewResult:
      type: object
      additionalProperties: false
      required: [items, applied, refused, failed]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BulkReviewItem'
        applied:
          type: integer
          minimum: 0
        refused:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          description: What went wrong and what to do, in English.
          type: string
        details:
          $ref: '#/components/schemas/ErrorDetails'

    ErrorDetails:
      description: Machine-readable context; which keys appear depends on `code`.
      type: object
      additionalProperties: false
      properties:
        field:
          description: The field that is wrong (`invalid_request`).
          type: string
        policy:
          description: The policy decision (`refused`).
          $ref: '#/components/schemas/PolicyDecision'
        ref:
          description: The memory's or gate's display ID (`edit_clash`, `invalid_transition`, `judge_pending`), the decision in force a flagged proposal contradicts (`in_conflict`), or what is in an undo's way (`undo_refused`).
          type: string
        status:
          description: The gate's status now (`invalid_transition` on a gate).
          $ref: '#/components/schemas/GateStatus'
        reason:
          description: Why an undo was refused (`undo_refused`).
          $ref: '#/components/schemas/UndoRefusal'
        expected_version:
          description: The version you sent (`edit_clash`).
          type: integer
        current_version:
          description: The memory's version now (`edit_clash`).
          type: integer
        retry_after:
          description: Seconds to wait (`rate_limited`, `busy`, `judge_pending`).
          type: integer
        limit:
          description: The rate limit (`rate_limited`), or the plan's asks a month (`refused` with policy `ask_limit`).
          type: integer
        current:
          description: Requests counted so far (`rate_limited`), or asks this month (`ask_limit`).
          type: integer
        reset_at:
          description: When the window resets (`rate_limited`), or when asks start again (`ask_limit`, the 1st, UTC).
          $ref: '#/components/schemas/Timestamp'
        notes:
          description: The V1 memories a space holds (`space_has_notes`).
          type: integer
        state:
          description: How a device's code ended (`invalid_transition` on a device code).
          $ref: '#/components/schemas/DeviceAuthorizationState'

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'

    SpaceEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Space'

    ImportResultEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ImportResult'

    ImportViewEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ImportView'

    ImportPageEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ImportPage'

    ImportConflictResultEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ImportConflictResult'

    BulkReviewResultEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/BulkReviewResult'

    SpaceListEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SpaceList'

    MemoryPageEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MemoryPage'

    ReviewPageEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ReviewPage'

    ReceiptPageEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ReceiptPage'

    MemoryDetailEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MemoryDetail'

    CommandResultEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CommandResult'

    NearDuplicatesEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/NearDuplicates'

    MemoriesCommandResultEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MemoriesCommandResult'

    ConflictEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Conflict'

    AgentListEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AgentList'

    AgentDetailEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AgentDetail'

    AgentCommandResultEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AgentCommandResult'

    BriefEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Brief'

    BriefResultEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/BriefResult'

    BriefVersionPageEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/BriefVersionPage'

    TargetListEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TargetList'

    TargetResultEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TargetResult'

    TargetPreviewEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TargetPreview'

    CompileRunPageEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CompileRunPage'

    ObservationResultEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ObservationResult'

    DeliveryResultEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/DeliveryResult'

    DriftEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Drift'

    DriftResolutionEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/DriftResolutionResult'

    GatePageEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/GatePage'

    GateEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Gate'

    GateResultEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/GateResult'

    ReadPageEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ReadPage'

    CompileLoadResultEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CompileLoadResult'

    CheckpointPageEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CheckpointPage'

    # ------------------------------------------------------------------
    # Device sign-in (CliAuth, /device)
    # ------------------------------------------------------------------
    DeviceCodeRequest:
      type: object
      additionalProperties: false
      required: [user_code]
      properties:
        user_code:
          description: The code the terminal shows, e.g. "WQRT-4821". Case, spaces and the dash don't matter.
          type: string
          minLength: 1
          maxLength: 32

    DeviceAuthorizationState:
      description: |
        Where a device's code stands: `pending` (waiting for a person),
        `approved` (confirmed; the device hasn't collected its session
        yet), `signed_in` (the device collected it), `denied` or `expired`
        (its 10 minutes are up).
      type: string
      enum: [pending, approved, signed_in, denied, expired]

    DeviceAuthorization:
      description: |
        A device asking to sign in with a code. Everything about the device
        but `address` is what it says about itself.
      type: object
      additionalProperties: false
      required: [user_code, state, client_id, requested_at, expires_at]
      properties:
        user_code:
          description: The code, as people read it ("WQRT-4821").
          type: string
        state:
          $ref: '#/components/schemas/DeviceAuthorizationState'
        client_id:
          description: The client asking; only the memax CLI (`memax-cli`) signs in this way.
          type: string
        client_version:
          description: The client's version, e.g. "2.0.0".
          type: string
        device_name:
          description: The machine's name, e.g. "ziyang-mbp".
          type: string
        device_os:
          description: The machine's system.
          type: string
          enum: [macOS, Linux, Windows, FreeBSD, other]
        space:
          description: The space the CLI will use, by slug; it can switch in the terminal.
          type: string
        address:
          description: The address the request came from, as Memax saw it.
          type: string
        requested_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        decided_at:
          description: When you confirmed or declined it.
          $ref: '#/components/schemas/Timestamp'
        signed_in_at:
          description: When the device collected its session.
          $ref: '#/components/schemas/Timestamp'

    DeviceAuthorizationEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/DeviceAuthorization'
