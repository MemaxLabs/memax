        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/spaces/{space}/brief:
    parameters:
      - $ref: '#/components/parameters/SpacePath'
    get:
      operationId: getBrief
      tags: [briefs]
      summary: Read the Brief
      description: |
        The space's current Brief version, with the receipt of whoever wrote
        it. A memory item is a display ID; render its statement from the
        memory itself. 404 when the space has no Brief yet.
      responses:
        '200':
          description: The current version.
          headers:
            ETag:
              $ref: '#/components/headers/VersionETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: reviseBrief
      tags: [briefs]
      summary: Revise the Brief
      description: |
        Writes a new version (`B-`) of the space's Brief: ordered sections of
        memory items and cited prose. Every memory item must be a kept
        memory of the space; every prose line must cite at least one kept
        memory, and nothing forgotten or rejected. Send `If-Match` with the
        version you started from; it is required once the space has a
        Brief. People who may keep revise the Brief; agents can't. Every
        target of the space recompiles.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviseBriefRequest'
      responses:
        '201':
          description: The new version.
          headers:
            ETag:
              $ref: '#/components/headers/VersionETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/EditClash'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/spaces/{space}/brief/versions:
    parameters:
      - $ref: '#/components/parameters/SpacePath'
    get:
      operationId: listBriefVersions
      tags: [briefs]
      summary: List the Brief's versions
      description: |
        Every version of the space's Brief, newest first, each with the
