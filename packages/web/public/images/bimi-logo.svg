<?xml version="1.0" encoding="UTF-8"?>
<!--
  BIMI (Brand Indicators for Message Identification) logo for memax.

  This file intentionally differs from memax-icon.svg:
    - SVG Tiny 1.2 Portable-Secure profile (baseProfile="tiny-ps")
    - Explicit version="1.2"
    - <title> element (required by the Tiny-PS schema)
    - Explicit hex colors instead of currentColor (mail clients don't
      resolve CSS currentColor)
    - Opaque white <rect> background (BIMI requires opaque)
    - No <script>, <foreignObject>, <a>, or external refs

  Referenced by the BIMI DNS record:
    default._bimi.memax.app IN TXT "v=BIMI1; l=https://memax.app/images/bimi-logo.svg; a="

  Gmail only renders this if combined with a DMARC policy of p=quarantine
  or p=reject AND a VMC/CMC certificate. Yahoo + Fastmail-class clients
  render it without a VMC when DMARC is enforced. See
  docs/infra/email-sender-identity.md for the full setup checklist.
-->
