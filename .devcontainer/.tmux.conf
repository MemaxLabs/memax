set -g prefix C-a
set -g mouse on

# Start windows and panes at 1, not 0 (easier to reach on keyboard)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Longer scrollback history
set -g history-limit 50000

# Faster escape time (important for VS Code)
set -g escape-time 10

# Click to select pane without sending the click to the program inside
set -g focus-events on

# Keep VS Code/devcontainer auth and IPC variables available in new panes.
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY VSCODE_GIT_IPC_HANDLE VSCODE_IPC_HOOK_CLI VSCODE_NONCE REMOTE_CONTAINERS_IPC"

# Don't exit copy mode when dragging with mouse
set -g @yank-action 'copy-pipe-no-clear'

# Status bar - show windows as clickable tabs
set -g status-position top
set -g status-left ''
set -g status-right '#H | %H:%M'

# Highlight active window in status bar
set-window-option -g window-status-current-style bg=blue,fg=white,bold

# Selection still in copy mode
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'  # better defaults
set -g @plugin 'tmux-plugins/tmux-yank'       # proper clipboard support
# Initialize tpm (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
