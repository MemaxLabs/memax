        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v2/spaces/{space}/targets:
    parameters:
      - $ref: '#/components/parameters/SpacePath'
    get:
      operationId: listTargets
      tags: [targets]
      summary: List where the space compiles to
      description: |
        The space's targets (AGENTS.md, the CLAUDE.md shim, scoped Cursor
        rules, the ChatGPT copy-out, …), each with its sync state, its latest
        compile run and what is on disk. Not paginated.
      responses:
        '200':
          description: The targets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createTarget
      tags: [targets]
      summary: Add a target
      description: |
        Adds a compile target to the space, with the kind's defaults for
        whatever you leave out (path, settings, delivery), and compiles it.
        The space needs a Brief first. People who may keep add targets.
      parameters:
