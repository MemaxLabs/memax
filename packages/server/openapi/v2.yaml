      tags: [targets]
      summary: Change a target
      description: |
        Changes a target's path, settings or delivery, or stops and restarts
        compiling it (`enabled`), and recompiles it. Send `If-Match` with
        the target's version to be sure you change what you saw. A change
        that changes nothing writes nothing and has no receipts.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
        - $ref: '#/components/parameters/Via'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureTargetRequest'
      responses:
        '200':
          $ref: '#/components/responses/TargetResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/EditClash'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
